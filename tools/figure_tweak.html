<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调图</title>
<style>
  /* the paper's own palette: ink text, Ru blue, Fe green, one red for what is selected */
  :root { --ink:#1b1b1b; --line:#c3c8d1; --rule:#dfe3e9; --blue:#5677b5; --blue-d:#304c86; --tint:#e8edf7;
          --green-d:#467238; --red:#d9474f; --amber:#a85e24; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 "Microsoft YaHei", Arial, sans-serif; color:var(--ink); background:#fff;
         display:grid; grid-template-columns: 260px 1fr 330px; grid-template-rows: auto auto 1fr; }
  header, .bar { grid-column: 1 / 4; display:flex; gap:8px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line);
                 flex-wrap:wrap; background:#fff; }
  .bar { padding:6px 14px; }
  .brand { font-weight:700; font-size:16px; margin-right:6px; letter-spacing:.04em; }
  .sep { width:1px; height:24px; background:var(--line); margin:0 2px; }
  .lbl { font-weight:700; }
  select, button, input, textarea { font:inherit; color:inherit; }
  select { padding:4px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  button { padding:4px 11px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--blue); background:var(--tint); }
  button.primary { background:var(--blue-d); color:#fff; border-color:var(--blue-d); font-weight:700; }
  button.primary:hover:not(:disabled) { background:#253d6e; }
  button.on { background:var(--blue-d); border-color:var(--blue-d); color:#fff; }
  button.danger { color:var(--red); border-color:#e6b3b7; }
  button:disabled { opacity:.38; cursor:default; }
  button.icon { min-width:32px; padding:4px 8px; }
  #status { margin-left:auto; font-weight:700; }
  #status.warn { color:var(--red); }
  .chip { padding:2px 11px; border:1px solid var(--line); border-radius:4px; cursor:pointer; user-select:none; background:#fff; }
  .chip.on { background:var(--tint); border-color:var(--blue); color:var(--blue-d); font-weight:700; }
  .chip.alarm.on { background:#fbe9ea; border-color:var(--red); color:var(--red); }
  aside { overflow:auto; border-right:1px solid var(--line); }
  aside.right { border-right:none; border-left:1px solid var(--line); padding:6px 14px 14px; }
  aside h3 { font-size:14px; margin:16px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
  .title { font-size:15px; font-weight:700; margin:8px 0 2px; }
  #layers { padding:4px 0 12px; }
  .ghead { display:flex; align-items:center; gap:6px; padding:6px 12px; cursor:pointer; font-weight:700; border-bottom:1px solid var(--rule); }
  .ghead:hover, .row:hover { background:var(--tint); }
  .caret { width:12px; }
  .row { display:flex; align-items:center; gap:7px; padding:3px 12px 3px 28px; cursor:pointer; white-space:nowrap; font-size:13px; }
  .row.sel, .ghead.sel { background:var(--tint); box-shadow: inset 3px 0 0 var(--blue-d); }
  .row.msel { background:#f2f5fb; box-shadow: inset 3px 0 0 var(--blue); }
  .nm { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .tag { font-size:12px; padding:0 5px; border-radius:3px; background:var(--tint); color:var(--blue-d); flex:none; font-weight:700; }
  .tag.shape { background:#fbe9ea; color:var(--red); }
  .eye { border:none; background:none; padding:0 2px; cursor:pointer; flex:none; font-size:13px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--blue); flex:none; }
  .hidden .nm { color:#7b818c; text-decoration:line-through; }
  main { overflow:auto; background:#fff; position:relative; }
  #board { padding:30px; display:inline-block; min-width:100%; }
  #stage { position:relative; display:inline-block; background:#fff; outline:1px solid var(--line); }
  #stage.paint { cursor:copy; }
  #stage svg { display:block; user-select:none; }
  .box { position:absolute; pointer-events:none; border:1px dashed var(--blue); }
  .box.sel { border:1.5px solid var(--red); }
  .box.msel { border:1.5px dashed var(--red); }
  .box.ovl { border:1.5px solid var(--amber); background:rgba(168,94,36,.10); }
  .guide { position:absolute; pointer-events:none; background:var(--red); }
  .handle { position:absolute; width:11px; height:11px; background:#fff; border:2px solid var(--red); border-radius:2px;
            cursor:move; pointer-events:auto; z-index:3; }
  .prop { display:grid; grid-template-columns: 86px 1fr; gap:7px 8px; align-items:center; }
  .prop input[type=number], .prop textarea, .prop select { width:100%; padding:3px 7px; border:1px solid var(--line); border-radius:4px; }
  .prop textarea { resize:vertical; min-height:32px; }
  .pair { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .btns { display:flex; flex-wrap:wrap; gap:5px; }
  .btns button { padding:3px 9px; }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; }
  .sw { width:24px; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,.25); cursor:pointer; position:relative; }
  .sw.none { background: linear-gradient(135deg, #fff 45%, var(--red) 46%, var(--red) 54%, #fff 55%) !important; }
  .sw.active { outline:2px solid var(--red); outline-offset:2px; }
  .sw.changed::after { content:""; position:absolute; right:-4px; top:-4px; width:8px; height:8px; border-radius:50%;
                       background:var(--blue-d); border:1px solid #fff; }
  .pal .row2 { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .pal .row2 > span { min-width:56px; font-weight:700; font-size:13px; }
  .note { font-size:13px; margin:6px 0; }
  .kv { font-family: Consolas, monospace; font-size:12px; word-break:break-all; }
  pre { white-space:pre-wrap; font-size:12px; border:1px solid var(--rule); padding:6px 8px; margin:0; }
  input[type=range] { width:100%; accent-color: var(--blue-d); }
  /* consistency dialog */
  #modal { position:fixed; inset:0; background:rgba(20,25,35,.35); display:none; align-items:flex-start; justify-content:center; z-index:20; }
  #modal.open { display:flex; }
  .dlg { background:#fff; margin-top:5vh; width:min(980px, 94vw); max-height:88vh; overflow:auto; border:1px solid var(--line);
         box-shadow:0 10px 40px rgba(20,30,50,.25); padding:16px 22px 22px; }
  .dlg h2 { font-size:18px; margin:4px 0 4px; }
  .dlg h4 { font-size:15px; margin:18px 0 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  table.grid { border-collapse:collapse; width:100%; font-size:13px; }
  table.grid th, table.grid td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  table.grid th { font-weight:700; }
  td.bad { color:var(--red); font-weight:700; }
  .ok { color:var(--green-d); font-weight:700; }
</style>
</head>
<body>
<header>
  <span class="brand">调图</span>
  <select id="figsel" title="选择图"></select>
  <span class="sep"></span>
  <button id="undo" class="icon" title="撤销 Ctrl+Z" disabled>↶</button>
  <button id="redo" class="icon" title="重做 Ctrl+Y" disabled>↷</button>
  <span class="sep"></span>
  <span class="lbl">插入</span>
  <button data-ins="text" title="文字">文字</button>
  <button data-ins="arrow" title="箭头">箭头 →</button>
  <button data-ins="line" title="直线或引线">线 —</button>
  <button data-ins="bracket" title="显著性括号">括号 ⊓</button>
  <button data-ins="box" title="圆角框">框 ▢</button>
  <span class="sep"></span>
  <button id="painter" title="把所选对象的字号、粗细、颜色、线宽刷给别的对象">格式刷</button>
  <button id="consist" title="检查所有图的分图字母、标题、坐标轴标题、刻度字号是否统一">全稿一致性</button>
  <span class="sep"></span>
  <button id="zout" class="icon" title="缩小">−</button>
  <span id="zpct" style="min-width:46px;text-align:center;font-weight:700">100%</span>
  <button id="zin" class="icon" title="放大">+</button>
  <button id="zfit">适应</button>
  <span id="status">载入中…</span>
  <button id="discard" disabled>放弃未保存</button>
  <button id="resetAll" class="danger">全部还原</button>
  <button id="save" class="primary" disabled title="Ctrl+S">保存并重新出图</button>
</header>
<div class="bar"><span class="lbl">点击可选中</span><span id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <span class="sep"></span><span id="ovlChip" class="chip alarm">重叠检查</span></div>
<aside><div id="layers"></div></aside>
<main id="main"><div id="board"><div id="stage"></div></div></main>
<aside class="right" id="props"></aside>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<script>
const PT_MM = 25.4 / 72, SVGNS = "http://www.w3.org/2000/svg";
const KINDS = { figure: "画布", axes: "图表", text: "文字", axislabel: "坐标轴标题", ticks: "刻度/类别标签", legend: "图例",
                scatter: "点", line: "线", patch: "形状/色块", collection: "误差线/色带", image: "图片", shape: "插入的形状" };
const SHAPES = { arrow: "箭头", line: "线", bracket: "显著性括号", box: "圆角框" };
const TAG = { figure: "画布", axes: "图表", text: "字", axislabel: "轴题", ticks: "刻度", legend: "图例", scatter: "点",
              line: "线", patch: "块", collection: "带", image: "图", shape: "形" };
const FILTERS = [["axes", "整个图表"], ["text", "文字"], ["axislabel", "坐标轴标题"], ["ticks", "刻度/类别"], ["legend", "图例"],
                 ["scatter", "点"], ["line", "线"], ["patch", "形状/色块"], ["collection", "误差线/色带"], ["shape", "插入的形状"]];
const MOVABLE = new Set(["axes", "text", "axislabel", "ticks", "legend", "shape"]);
const TEXTY = new Set(["text", "axislabel"]);
const SIZED = new Set(["text", "axislabel", "ticks", "legend"]);
const LW = new Set(["line", "patch", "collection", "scatter", "axes"]);
const ALPHA = new Set(["text", "axislabel", "scatter", "line", "patch", "collection", "image", "shape"]);
const ANCHOR = { left: "start", center: "middle", right: "end" };
let svg, meta = {}, ids = {}, items = {}, stored = {}, cur = {}, undoS = [], redoS = [];
let sel = null, multi = new Set(), hover = null, drag = null, figInfo = {}, zoom = 1, activeColor = null, openGroups = new Set();
let showOverlap = false, lastWarn = "", painter = null;
let enabled = { axes: false, text: true, axislabel: true, ticks: true, legend: true, scatter: true, line: true, patch: true,
                collection: true, image: true, shape: true };
try { Object.assign(enabled, JSON.parse(localStorage.getItem("tw_filter4") || "{}")); } catch (e) {}
const $ = id => document.getElementById(id);
const stage = $("stage");
const clone = o => JSON.parse(JSON.stringify(o));
const setStatus = (s, warn) => { $("status").textContent = s; $("status").className = warn ? "warn" : ""; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (o, k, d) => (o && o[k] !== undefined && o[k] !== null ? o[k] : d);
const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "text" ? e.textContent = v : k === "html" ? e.innerHTML = v : k.startsWith("on") ? e[k] = v : e.setAttribute(k, v);
  kids.forEach(k => e.appendChild(k)); return e; };

// ---- filter chips --------------------------------------------------------------------------------------------------
function drawChips() {
  $("chips").innerHTML = "";
  for (const [k, name] of FILTERS)
    $("chips").appendChild(el("span", { class: "chip" + (enabled[k] ? " on" : ""), text: name, onclick: () => {
      enabled[k] = !enabled[k]; if (k === "collection") enabled.image = enabled[k];
      try { localStorage.setItem("tw_filter4", JSON.stringify(enabled)); } catch (e) {} drawChips(); } }));
  $("ovlChip").className = "chip alarm" + (showOverlap ? " on" : "");
}
$("ovlChip").onclick = () => { showOverlap = !showOverlap; drawChips(); drawBoxes(); if (svg) updateButtons(); };
drawChips();

// ---- loading -------------------------------------------------------------------------------------------------------
async function loadFigs() {
  figInfo = await fetch("/figs?" + Date.now()).then(r => r.json());
  $("figsel").innerHTML = figInfo.figs.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("");
  $("figsel").value = figInfo.current;
  document.title = (figInfo.figs.find(f => f[0] === figInfo.current) || [0, ""])[1] + " · 调图";
}
function prepEl(g, v) {
  g.querySelectorAll("text").forEach(t => t.dataset.orig = t.textContent);
  if (v.kind === "scatter")
    g.querySelectorAll("use, path").forEach(u => {
      if (u.tagName === "use") { u.dataset.cx = u.getAttribute("x"); u.dataset.cy = u.getAttribute("y"); }
      else { const b = u.getBBox(); u.dataset.cx = b.x + b.width / 2; u.dataset.cy = b.y + b.height / 2; }
    });
  else if (v.kind !== "ticks" || v.member !== undefined) {
    try { const b = g.getBBox(); g.dataset.cx = b.x + b.width / 2; g.dataset.cy = b.y + b.height / 2; } catch (e) {}
  }
}
async function load() {
  const [svgText, k, t] = await Promise.all([
    fetch("/svg?" + Date.now()).then(r => r.text()),
    fetch("/keys?" + Date.now()).then(r => r.json()),
    fetch("/tweaks?" + Date.now()).then(r => r.json())]);
  meta = k.meta || {}; ids = k.ids || k; stored = t; cur = clone(t); undoS = []; redoS = []; items = {};
  stage.innerHTML = svgText.replace(/^[\s\S]*?(<svg)/, "$1");
  svg = stage.querySelector("svg");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.querySelectorAll("[style]").forEach(e => e.dataset.os = e.getAttribute("style"));
  const Hmm = svg.viewBox.baseVal.height * PT_MM;
  for (const [id, v] of Object.entries(ids)) {
    const it = items[v.key] || (items[v.key] = Object.assign({ own: null, members: [] }, v, { member: undefined }));
    const g = svg.getElementById(id);
    if (v.member !== undefined) { it.members.push(id); if (g) g.dataset.member = v.member; }
    else it.own = id;
    if (!g) continue;
    if (v.kind === "shape") {                         // drawn by the editor from its settings; the render is hidden
      [id, ...(v.parts || [])].forEach(p => { const e = svg.getElementById(p); if (e) { e.dataset.keephidden = "1"; e.style.display = "none"; } });
      continue;
    }
    prepEl(g, v);
    if (v.arrow) {                                     // leader line: the end away from the data point follows
      const a = svg.getElementById(id + "_arrow"), p = a && a.querySelector("path");
      if (p) {
        const L = p.getTotalLength(), p0 = p.getPointAtLength(0), p1 = p.getPointAtLength(L);
        const d0 = Math.hypot(p0.x - v.arrow[0], p0.y - v.arrow[1]), d1 = Math.hypot(p1.x - v.arrow[0], p1.y - v.arrow[1]);
        const T = d0 > d1 ? p0 : p1;
        it.arrowEl = id + "_arrow"; it.T = [T.x, T.y];
      }
    }
  }
  for (const it of Object.values(items)) if (it.kind === "axes") {
    const m = it.key.match(/^ax@(-?\d+),(-?\d+),(\d+),(\d+)/);
    if (!m) continue;
    const [x, y, w, h] = m.slice(1).map(Number), s = stored[it.key] || {};
    it.w = w; it.h = h; it.prefix = it.key.slice(0, -"/axes".length) + "/";
    it.ox = (x + (s.dx_mm || 0)) / PT_MM; it.oy = (Hmm - (y + h + (s.dy_mm || 0))) / PT_MM;
  }
  syncAdded();
  if (sel && !items[sel.key]) sel = null;
  multi = new Set([...multi].filter(k => items[k]));
  if (!load.fitted) { fit(); load.fitted = true; } else applyZoom();
  preview(); drawLayers(); drawProps();
  setStatus(lastWarn || `${Object.keys(items).length} 个对象`, !!lastWarn);
}

// ---- inserted texts and shapes -------------------------------------------------------------------------------------
const X = mm => mm / PT_MM, Y = mm => svg.viewBox.baseVal.height - mm / PT_MM;
function addedText(key) {                             // an inserted text, shown until the next render draws it
  const a = (cur[key] || {}).add; if (!a) return;
  const id = "twnew_" + key.split("/").pop();
  const old = svg.getElementById(id); if (old) old.remove();
  const g = document.createElementNS(SVGNS, "g"); g.id = id;
  String(a.text || "").split("\n").forEach((ln, i) => {
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", X(a.x_mm)); t.setAttribute("y", Y(a.y_mm) + i * (a.size_pt || 7) * 1.2);
    t.setAttribute("style", `font-size: ${a.size_pt || 7}px; font-family: 'Arial'; text-anchor: start; fill: ${a.color || "#1b1b1b"}`);
    t.textContent = ln; g.appendChild(t);
  });
  svg.appendChild(g);
  g.querySelectorAll("[style]").forEach(e => e.dataset.os = e.getAttribute("style"));
  const v = { key, kind: "text", added: true, rotation: 0, ha: "left", colors: [a.color || "#1b1b1b"], fontsize: a.size_pt || 7 };
  ids[id] = v; items[key] = Object.assign({ own: id, members: [], fresh: true }, v);
  prepEl(g, v);
}
function headPath(x0, y0, x1, y1, L, W, filled) {      // arrow head at (x1, y1) pointing away from (x0, y0)
  const d = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / d, uy = (y1 - y0) / d;
  const bx = x1 - ux * L, by = y1 - uy * L, px = -uy * W, py = ux * W;
  return filled ? `M ${x1} ${y1} L ${bx + px} ${by + py} L ${bx - px} ${by - py} Z`
                : `M ${bx + px} ${by + py} L ${x1} ${y1} L ${bx - px} ${by - py}`;
}
function drawShape(key) {                             // the editor's drawing of an inserted shape, from its settings
  const id = "twshape_" + key.split("/").pop();
  const old = svg.getElementById(id); if (old) old.remove();
  const c = cur[key]; if (!c || !c.add || c.visible === false) return id;
  const a = c.add, ox = num(c, "dx_mm", 0), oy = num(c, "dy_mm", 0);
  const col = (c.colors || {})[(a.color || "#1b1b1b").toLowerCase()] || a.color || "#1b1b1b";
  const lw = num(a, "lw", 0.8) * num(c, "lw", 1);
  const dash = (a.ls || "-") === "--" ? `stroke-dasharray: ${3.7 * lw} ${1.6 * lw};` : "";
  const g = document.createElementNS(SVGNS, "g"); g.id = id; if (num(c, "alpha", 1) !== 1) g.style.opacity = c.alpha;
  const add = (tag, at) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(at)) e.setAttribute(k, v); g.appendChild(e); return e; };
  const stroke = `fill: none; stroke: ${col}; stroke-width: ${lw}; ${dash} stroke-linejoin: miter; stroke-linecap: butt`;
  if (a.type === "arrow" || a.type === "line") {
    const x0 = X(a.x0_mm + ox), y0 = Y(a.y0_mm + oy), x1 = X(a.x1_mm + ox), y1 = Y(a.y1_mm + oy);
    const head = a.head || (a.type === "arrow" ? "-|>" : "-"), hs = num(a, "head_size", 6), L = 0.4 * hs, W = 0.2 * hs;
    const filled = head.includes("|>"), both = head.startsWith("<");
    const d = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / d, uy = (y1 - y0) / d;
    const e1 = head !== "-" && filled ? L : 0, e0 = both && filled ? L : 0;
    add("path", { d: `M ${x0 + ux * e0} ${y0 + uy * e0} L ${x1 - ux * e1} ${y1 - uy * e1}`, style: stroke });
    add("path", { d: `M ${x0} ${y0} L ${x1} ${y1}`, style: "stroke: transparent; stroke-width: 6; fill: none" });   // easier to grab
    if (head !== "-") add("path", { d: headPath(x0, y0, x1, y1, L, W, filled), style: filled ? `fill: ${col}; stroke: ${col}; stroke-width: ${lw}` : stroke });
    if (both) add("path", { d: headPath(x1, y1, x0, y0, L, W, filled), style: filled ? `fill: ${col}; stroke: ${col}; stroke-width: ${lw}` : stroke });
  } else if (a.type === "box") {
    const r = num(a, "radius_mm", 1);
    add("rect", { x: X(a.x_mm + ox), y: Y(a.y_mm + oy + a.h_mm), width: X(a.w_mm), height: X(a.h_mm), rx: X(r), ry: X(r),
                  style: `fill: ${a.fill && a.fill !== "none" ? a.fill : "none"}; stroke: ${col}; stroke-width: ${lw}; ${dash}` });
    if (!a.fill || a.fill === "none")
      add("rect", { x: X(a.x_mm + ox), y: Y(a.y_mm + oy + a.h_mm), width: X(a.w_mm), height: X(a.h_mm), style: "fill: none; stroke: transparent; stroke-width: 6" });
  } else if (a.type === "bracket") {
    const x0 = X(a.x0_mm + ox), x1 = X(a.x1_mm + ox), y = Y(a.y_mm + oy), h = X(num(a, "h_mm", 1.5));
    add("path", { d: `M ${x0} ${y + h} L ${x0} ${y} L ${x1} ${y} L ${x1} ${y + h}`, style: stroke });
    add("path", { d: `M ${x0} ${y} L ${x1} ${y}`, style: "stroke: transparent; stroke-width: 6; fill: none" });
    const fs = num(a, "size_pt", 7) * num(c, "size", 1);
    const t = add("text", { x: (x0 + x1) / 2, y: y - X(num(a, "gap_mm", 0.3)),
                            style: `font-size: ${fs}px; font-family: 'Arial'; text-anchor: middle; fill: ${col}; font-weight: ${c.weight || "normal"}` });
    t.textContent = a.text ?? "*";
  }
  svg.appendChild(g);
  return id;
}
function syncAdded() {
  for (const key of new Set([...Object.keys(cur), ...Object.keys(items)])) {
    if (!key.startsWith("fig/added/")) continue;

      b.appendChild(el("div", { class: "swatches" }, [swatch(c.background || (it.background === "none" ? "#ffffff" : it.background), { title: "当前背景" })]));
      b.appendChild(palettePicker(nc => { push(); c.background = nc.toLowerCase(); afterEdit(); }));
      const g = el("div", { class: "prop", style: "margin-top:6px" });
      const r = el("input", { type: "range", min: 0, max: 1, step: 0.05 }); r.value = num(c, "background_alpha", 1);
      r.onchange = () => { push(); if (+r.value === 1) delete c.background_alpha; else c.background_alpha = +r.value; afterEdit(false); };
      g.append(el("label", { text: "不透明度" }), r); b.appendChild(g);
    }
    colorSection("颜色", it.key, it.added ? [((c.add || {}).color || "#1b1b1b")] : it.colors, "点一个颜色再选新颜色；只换这一种颜色，其余不变。");
  }
  const b = el("div", { class: "btns", style: "margin-top:14px" });
  b.appendChild(el("button", { text: "还原此对象", onclick: () => { push(); if (it.added) cur[it.key] = { add: clone((stored[it.key] || cur[it.key]).add) }; else cur[it.key] = {}; syncAdded(); afterEdit(); } }));
  if (it.added) b.appendChild(el("button", { class: "danger", text: "删除", onclick: () => { push(); delete cur[it.key]; select(null); syncAdded(); afterEdit(); } }));
  P.appendChild(b);
  drawLog();
}
function drawLog() {
  $("props").appendChild(el("h3", { text: "出图日志" }));
  $("props").appendChild(el("pre", { id: "log", text: drawLog.text || "—" }));
}

// ---- consistency across figures ------------------------------------------------------------------------------------
async function openConsistency() {
  const D = $("dlg"); D.innerHTML = "<h2>全稿一致性</h2><div class='note'>检查中…</div>"; $("modal").classList.add("open");
  const r = await fetch("/consistency?" + Date.now()).then(x => x.json());
  D.innerHTML = "";
  D.appendChild(el("div", { style: "display:flex;align-items:center;gap:10px" }, [el("h2", { text: "全稿一致性" }),
    el("button", { text: "关闭", style: "margin-left:auto", onclick: () => $("modal").classList.remove("open") })]));
  D.appendChild(el("div", { class: "note", text: "同一类文字在所有图里应当同字号、同粗细。下表列出与主流不一致的地方，红色为不一致的值。" }));
  if (r.missing.length) D.appendChild(el("div", { class: "note", style: "color:var(--red);font-weight:700", text: "这些图需要重新出图一次才能参与检查：" + r.missing.join("、") }));
  for (const ro of r.roles) {
    const info = ro.role === "text";
    const h = el("h4", { html: `${esc(ro.name)}<span style="font-weight:400">　主流 ${ro.mode} pt${ro.weight === "bold" ? "，粗体" : ""}　共 ${ro.n} 处　</span>` +
                                (info ? `<span style="font-weight:400">（按需不同，仅供参考）</span>` : ro.odd.length ? `<span style="color:var(--red)">${ro.odd.length} 处不一致</span>` : `<span class="ok">一致</span>`) });
    D.appendChild(h);
    D.appendChild(el("div", { class: "note", text: "字号分布：" + ro.sizes.slice().sort((a, b) => b[1] - a[1]).map(([s, n]) => `${s} pt × ${n}`).join("，") }));
    if (!ro.odd.length) continue;
    const inp = el("input", { type: "number", step: 0.5, style: "width:70px" }); inp.value = ro.mode;
    const wsel = el("select", { html: `<option value="">粗细不变</option><option value="bold">统一粗体</option><option value="normal">统一常规</option>` });
    if (ro.role === "letter" || ro.role === "title") wsel.value = ro.weight;
    const go = el("button", { class: "primary", text: `把这 ${ro.odd.length} 处统一`, onclick: async () => {
      if (dirtyKeys().length && !confirm("当前图有未保存的调整，统一后会重新载入并放弃它们。继续？")) return;
      go.disabled = true; go.textContent = "重新出图中…（每张图约半分钟）";
      const res = await fetch("/unify", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: ro.odd, size: +inp.value, weight: wsel.value || null }) }).then(x => x.json());
      drawLog.text = res.log; await loadFigs(); await load(); updateButtons(); openConsistency();
    } });
    h.append(el("span", { text: "统一为" }), inp, el("span", { text: "pt" }), wsel, go);
    const rows = ro.odd.map(x => `<tr><td>${esc(x.label)}</td><td>${esc(shortKey(x.key))}</td><td class="${Math.abs(x.size - ro.mode) > 0.05 ? "bad" : ""}">${x.size}</td>` +
      `<td class="${x.weight !== ro.weight && (ro.role === "letter" || ro.role === "title") ? "bad" : ""}">${x.weight === "bold" ? "粗体" : "常规"}</td>` +
      `<td><button data-fig="${esc(x.fig)}" data-key="${esc(x.key)}">定位</button></td></tr>`).join("");
    const t = el("table", { class: "grid", html: `<tr><th>图</th><th>文字</th><th>字号 pt</th><th>粗细</th><th></th></tr>${rows}` });
    t.querySelectorAll("button[data-fig]").forEach(b => b.onclick = () => locate(b.dataset.fig, b.dataset.key));
    D.appendChild(t);
  }
}
function shortKey(k) {
  if (k.includes("/text/")) return k.replace(/^.*?\/text\//, "").replace(/#\d+$/, "").replace(/\n/g, " ");
  if (k.endsWith("ticks")) return (k.endsWith("xticks") ? "横轴" : "纵轴") + "刻度";
  if (k.includes("/legend/")) return "图例";
  return k;
}
async function locate(fig, key) {
  $("modal").classList.remove("open");
  if (fig !== figInfo.current) {
    if (dirtyKeys().length && !confirm("有未保存的调整，切换会放弃它们。继续？")) return;
    load.fitted = false; openGroups = new Set();
    await fetch("/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fig }) });
    await loadFigs(); await load(); updateButtons();
  }
  if (items[key]) select({ key, member: null });
}
$("consist").onclick = openConsistency;
$("modal").onclick = e => { if (e.target === $("modal")) $("modal").classList.remove("open"); };

// ---- edit history --------------------------------------------------------------------------------------------------
function normObj(o) {
  const r = {};
  for (const [k, v] of Object.entries(o || {})) {
    if (["dx_mm", "dy_mm", "dw_mm", "dh_mm"].includes(k) && Math.abs(v) < 1e-3) continue;
    if (["size", "scale", "lw"].includes(k) && Math.abs(v - 1) < 1e-3) continue;
    if ((k === "rename" || k === "colors") && !Object.keys(v).length) continue;
    if (k === "visible" && v === true) continue;
    r[k] = typeof v === "number" ? Math.round(v * 1000) / 1000 : v;
  }
  return r;
}
const sig = o => { const r = normObj(o); return JSON.stringify(Object.keys(r).sort().map(k => [k, r[k]])); };
const dirty = k => sig(cur[k]) !== sig(stored[k]);
const dirtyKeys = () => [...new Set([...Object.keys(cur), ...Object.keys(stored)])].filter(dirty);
function push() { undoS.push(clone(cur)); if (undoS.length > 300) undoS.shift(); redoS = []; }
function undo() { if (!undoS.length) return; redoS.push(clone(cur)); cur = undoS.pop(); syncAdded(); afterEdit(); }
function redo() { if (!redoS.length) return; undoS.push(clone(cur)); cur = redoS.pop(); syncAdded(); afterEdit(); }
function updateButtons() {
  const any = dirtyKeys().length;
  $("save").disabled = !any; $("discard").disabled = !any;
  $("undo").disabled = !undoS.length; $("redo").disabled = !redoS.length;
  if (painter) return;
  if (showOverlap && drawBoxes.nOvl !== undefined) setStatus(`${drawBoxes.nOvl} 处文字重叠` + (any ? `，${any} 处未保存` : ""), drawBoxes.nOvl > 0);
  else if (any) setStatus(`${any} 处未保存`);
  else if (/未保存/.test($("status").textContent)) setStatus("已是最新");
}

// ---- mouse and keyboard --------------------------------------------------------------------------------------------
const pxToMm = () => PT_MM / svg.getScreenCTM().a;
function startDrag(e, mode, onHandle) {
  if (!sel) return;
  push();
  const keys = mode === "handle" ? [sel.key] : [...multi].filter(k => MOVABLE.has(items[k].kind));
  const start = Object.fromEntries(keys.map(k => { const c = curOf(k);
    return [k, { dx: num(c, "dx_mm", 0), dy: num(c, "dy_mm", 0), dw: num(c, "dw_mm", 0), dh: num(c, "dh_mm", 0), add: clone(c.add || {}) }]; }));
  const moving = new Set(keys), r0 = rectOf(sel.key), cand = { x: [], y: [] };
  if (mode === "move" && r0) {
    for (const it of Object.values(items)) {
      if (moving.has(it.key) || !(TEXTY.has(it.kind) || it.kind === "legend" || it.kind === "axes" || it.kind === "shape")) continue;
      const bg = it.kind === "axes" ? svg.getElementById(it.own + "_bg") : null;
      const b = bg ? bg.getBoundingClientRect() : rectOf(it.key); if (!b) continue;
      const r = bg ? { l: b.left, t: b.top, r: b.right, b: b.bottom } : b;
      cand.x.push(r.l, (r.l + r.r) / 2, r.r); cand.y.push(r.t, (r.t + r.b) / 2, r.b);
    }
    const s = svg.getBoundingClientRect(); cand.x.push((s.left + s.right) / 2); cand.y.push((s.top + s.bottom) / 2);
  }
  drag = { mode, keys, start, x0: e.clientX, y0: e.clientY, r0, cand, moved: false, onHandle };
  stage.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
}
function snap(d, dxPx, dyPx, off) {
  if (off || !d.r0) { showGuides([], []); return [dxPx, dyPx]; }
  const r = d.r0, xs = [r.l + dxPx, (r.l + r.r) / 2 + dxPx, r.r + dxPx], ys = [r.t + dyPx, (r.t + r.b) / 2 + dyPx, r.b + dyPx];
  let bx = null, by = null;
  for (const x of xs) for (const c of d.cand.x) if (Math.abs(c - x) < 5 && (!bx || Math.abs(c - x) < Math.abs(bx[0]))) bx = [c - x, c];
  for (const y of ys) for (const c of d.cand.y) if (Math.abs(c - y) < 5 && (!by || Math.abs(c - y) < Math.abs(by[0]))) by = [c - y, c];
  showGuides(bx ? [bx[1]] : [], by ? [by[1]] : []);
  return [dxPx + (bx ? bx[0] : 0), dyPx + (by ? by[0] : 0)];
}
stage.addEventListener("pointerdown", e => {
  if (e.target.classList.contains("handle")) return;
  const p = pick(e);
  if (painter) { if (p) paintOnto(p.key); return; }
  if (e.shiftKey) { if (p) select(p, true); return; }
  if (!(p && multi.has(p.key) && multi.size > 1)) select(p);
  else { sel = p; drawBoxes(); }
  if (p && MOVABLE.has(items[p.key].kind)) startDrag(e, "move");
});
stage.addEventListener("pointermove", e => {
  if (drag) {
    const k = pxToMm(); drag.moved = true;
    if (drag.mode === "handle") {
      const key = drag.keys[0], st = drag.start[key], c = curOf(key), dx = (e.clientX - drag.x0) * k, dy = -(e.clientY - drag.y0) * k;
      drag.onHandle(Object.keys(st.add).length ? st.add : st, dx, dy, c);
      if (c.add) for (const kk of Object.keys(c.add)) if (typeof c.add[kk] === "number") c.add[kk] = +c.add[kk].toFixed(2);
    } else {
      const [dxp, dyp] = snap(drag, e.clientX - drag.x0, e.clientY - drag.y0, e.altKey);
      for (const key of drag.keys) {
        const it = items[key], c = curOf(key), st = drag.start[key];
        if (it.kind === "shape") { c.add = clone(st.add); c.dx_mm = dxp * k; c.dy_mm = -dyp * k; continue; }
        if (!(it.kind === "ticks" && it.axis === "x")) c.dx_mm = st.dx + dxp * k;
        if (!(it.kind === "ticks" && it.axis === "y")) c.dy_mm = st.dy - dyp * k;
      }
    }
    previewGeom(); return;
  }
  const h = pick(e);
  if ((h && h.key) !== (hover && hover.key)) { hover = h; drawBoxes(); }
});
stage.addEventListener("pointerup", () => {
  if (!drag) return;
  showGuides([], []);
  if (!drag.moved) undoS.pop();
  for (const key of drag.keys) {                       // a dragged shape keeps its new coordinates, not an offset
    const it = items[key], c = cur[key];
    if (it && it.kind === "shape" && c && c.add) bake(c);
  }
  drag = null; afterEdit();
});
function bake(c) {
  const a = c.add, dx = num(c, "dx_mm", 0), dy = num(c, "dy_mm", 0);
  for (const k of ["x0_mm", "x1_mm", "x_mm"]) if (k in a) a[k] = +(a[k] + dx).toFixed(2);
  for (const k of ["y0_mm", "y1_mm", "y_mm"]) if (k in a) a[k] = +(a[k] + dy).toFixed(2);
  delete c.dx_mm; delete c.dy_mm;
}
function scaleSel(f) {
  const ks = multi.size ? [...multi] : sel ? [sel.key] : [];
  if (!ks.length) return;
  push();
  let any = false;
  for (const key of ks) {
    const it = items[key], c = curOf(key);
    if (it.kind === "axes") { c.dw_mm = (it.w + num(c, "dw_mm", 0)) * f - it.w; c.dh_mm = (it.h + num(c, "dh_mm", 0)) * f - it.h; }
    else if (it.kind === "scatter") c.scale = num(c, "scale", 1) * f;
    else if (SIZED.has(it.kind)) c.size = num(c, "size", 1) * f;
    else if (it.kind === "shape") { if (it.shape === "box") { c.add.w_mm = +(c.add.w_mm * f).toFixed(2); c.add.h_mm = +(c.add.h_mm * f).toFixed(2); } else c.add.lw = +(num(c.add, "lw", 0.8) * f).toFixed(2); }
    else if (LW.has(it.kind)) c.lw = num(c, "lw", 1) * f;
    else continue;
    any = true;
  }
  if (!any) { undoS.pop(); return; }
  afterEdit();
}
$("main").addEventListener("wheel", e => {
  if (e.ctrlKey) { e.preventDefault(); zoom = Math.max(0.3, Math.min(10, zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1))); applyZoom(); return; }
  if (!sel) return;
  const r = rectOf(sel.key);
  if (!r || e.clientX < r.l || e.clientX > r.r || e.clientY < r.t || e.clientY > r.b) return;
  e.preventDefault(); scaleSel(e.deltaY < 0 ? 1.05 : 1 / 1.05);
}, { passive: false });
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("save").disabled) $("save").click(); return; }
  if (typing) return;
  if (e.key === "Escape") { if ($("modal").classList.contains("open")) { $("modal").classList.remove("open"); return; } if (painter) { togglePainter(); return; } select(null); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { redo(); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { undo(); e.preventDefault(); return; }
  if (!sel) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    push(); for (const k of multi) { if (items[k].added) delete cur[k]; else curOf(k).visible = false; }
    select(null); syncAdded(); afterEdit(); e.preventDefault(); return;
  }
  if (e.key === "+" || e.key === "=") { scaleSel(1.05); e.preventDefault(); return; }
  if (e.key === "-" || e.key === "_") { scaleSel(1 / 1.05); e.preventDefault(); return; }
  const s = e.shiftKey ? 0.5 : 0.1;
  const d = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, s], ArrowDown: [0, -s] }[e.key];
  if (!d) return;
  const ks = [...multi].filter(k => MOVABLE.has(items[k].kind)); if (!ks.length) return;
  e.preventDefault(); push();
  for (const key of ks) moveMm(key, d[0], d[1]);
  afterEdit(false);
});

// ---- server --------------------------------------------------------------------------------------------------------
async function post(path, body) {
  setStatus("重新出图中…");
  document.querySelectorAll("header button, header select").forEach(b => b.disabled = true);
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json());
  drawLog.text = r.log;
  const stale = (r.log.match(/tweaks: (\d+) entr(?:y|ies) match no artist/) || [])[1];
  lastWarn = !r.log.startsWith("OK") ? "出图出错，见右侧日志" : stale ? `已出图；${stale} 处调整找不到对象，见日志` : "";
  await loadFigs(); await load();
  document.querySelectorAll("header button, header select").forEach(b => b.disabled = false);
  updateButtons(); drawProps();
  setStatus(lastWarn || "已保存并重新出图", !!lastWarn);
  lastWarn = "";
}
$("save").onclick = () => {
  const out = {};
  for (const k of dirtyKeys()) { const o = normObj(cur[k]); out[k] = Object.keys(o).length ? o : null; }
  post("/save", out);
};
$("undo").onclick = undo; $("redo").onclick = redo;
$("discard").onclick = () => { push(); cur = clone(stored); syncAdded(); afterEdit(); };
$("resetAll").onclick = () => { if (confirm("清除这张图的全部手动调整（包括插入的文字和形状）并重新出图？")) post("/reset_all", {}); };
$("figsel").onchange = async () => {
  if (dirtyKeys().length && !confirm("有未保存的调整，切换会放弃它们。继续？")) { $("figsel").value = figInfo.current; return; }
  sel = null; multi = new Set(); hover = null; load.fitted = false; openGroups = new Set(); setStatus("切换中…");
  await fetch("/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fig: $("figsel").value }) });
  await loadFigs(); await load(); updateButtons();
};
window.addEventListener("resize", drawBoxes);
window.addEventListener("beforeunload", e => { if (dirtyKeys().length) { e.preventDefault(); e.returnValue = ""; } });
loadFigs().then(load).then(updateButtons);
</script>
