<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调图</title>
<style>
  :root { --ink:#1d2330; --sub:#3c4454; --line:#e2e5ea; --soft:#f5f6f8; --acc:#2563eb; --acc-soft:#e8efff;
          --sel:#e2445c; --warn:#e8890c; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.45 "Microsoft YaHei", "Segoe UI", Arial, sans-serif; color:var(--ink); background:#fff;
         display:grid; grid-template-columns: 250px 1fr 310px; grid-template-rows: auto auto 1fr; }
  header { grid-column: 1 / 4; display:flex; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--line); }
  header .brand { font-weight:700; font-size:15px; margin-right:4px; }
  .sep { width:1px; height:22px; background:var(--line); }
  select, button, input, textarea { font:inherit; color:inherit; }
  select { padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--soft); }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.primary:hover:not(:disabled) { background:#1d4fd0; }
  button.on { background:var(--acc-soft); border-color:#b9cdfb; color:#123a9c; }
  button:disabled { opacity:.4; cursor:default; }
  button.icon { padding:4px 8px; min-width:30px; }
  #status { margin-left:auto; color:var(--sub); }
  #status.warn { color:#b25e00; }
  .filters { grid-column: 1 / 4; display:flex; gap:6px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line);
             flex-wrap:wrap; }
  .chip { padding:2px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; user-select:none; background:#fff; }
  .chip.on { background:var(--acc-soft); border-color:#b9cdfb; color:#123a9c; }
  .chip.warn.on { background:#fff3e0; border-color:#f3c27a; color:#8a4b00; }
  aside { overflow:auto; border-right:1px solid var(--line); }
  aside.right { border-right:none; border-left:1px solid var(--line); padding:10px 12px; }
  aside h3 { font-size:12px; color:var(--sub); margin:14px 0 6px; font-weight:700; }
  aside h3:first-child { margin-top:2px; }
  #layers { padding:6px 0; }
  .ghead { display:flex; align-items:center; gap:6px; padding:5px 10px; cursor:pointer; font-weight:600; }
  .ghead:hover, .row:hover { background:var(--soft); }
  .tw-caret { width:12px; color:var(--sub); }
  .row { display:flex; align-items:center; gap:6px; padding:3px 10px 3px 26px; cursor:pointer; white-space:nowrap; }
  .row.sel, .ghead.sel { background:var(--acc-soft); }
  .row.msel { background:#f0f4ff; }
  .row .nm, .ghead .nm { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .tag { font-size:11px; padding:0 5px; border-radius:4px; background:var(--soft); color:var(--sub); flex:none; }
  .eye { border:none; background:none; padding:0 2px; cursor:pointer; color:var(--sub); flex:none; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--acc); flex:none; }
  .hidden .nm { color:#8a909c; text-decoration:line-through; }
  main { overflow:auto; background:#fff; position:relative; }
  #board { padding:28px; display:inline-block; min-width:100%; }
  #stage { position:relative; display:inline-block; background:#fff; box-shadow:0 0 0 1px #e6e8ec, 0 6px 24px rgba(20,30,50,.08); }
  #stage svg { display:block; user-select:none; }
  .box { position:absolute; pointer-events:none; border:1px dashed var(--acc); }
  .box.sel { border:1.5px solid var(--sel); }
  .box.msel { border:1.5px dashed var(--sel); }
  .box.ovl { border:1.5px solid var(--warn); background:rgba(232,137,12,.10); }
  .guide { position:absolute; pointer-events:none; background:#ff3d8b; }
  .handle { position:absolute; width:10px; height:10px; background:#fff; border:1.5px solid var(--sel); border-radius:2px;
            cursor:nwse-resize; pointer-events:auto; }
  .prop { display:grid; grid-template-columns: 82px 1fr; gap:6px 8px; align-items:center; }
  .prop label { color:var(--sub); }
  .prop input[type=number], .prop textarea { width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:5px; }
  .prop textarea { resize:vertical; min-height:30px; }
  .btns { display:flex; flex-wrap:wrap; gap:4px; }
  .btns button { padding:3px 8px; }
  .swatches { display:flex; flex-wrap:wrap; gap:5px; }
  .sw { width:22px; height:22px; border-radius:5px; border:1px solid rgba(0,0,0,.18); cursor:pointer; position:relative; }
  .sw.active { outline:2px solid var(--sel); outline-offset:1px; }
  .sw.changed::after { content:""; position:absolute; right:-3px; top:-3px; width:7px; height:7px; border-radius:50%;
                       background:var(--acc); border:1px solid #fff; }
  .pal { margin-top:6px; }
  .pal .row2 { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .hint { color:var(--sub); font-size:12px; }
  .kv { font-family: Consolas, monospace; font-size:11px; color:var(--sub); word-break:break-all; }
  pre { white-space:pre-wrap; font-size:11px; background:var(--soft); padding:6px; margin:0; border-radius:5px; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<header>
  <span class="brand">调图</span>
  <select id="figsel" title="选择图"></select>
  <span class="sep"></span>
  <button id="undo" class="icon" title="撤销 Ctrl+Z" disabled>↶</button>
  <button id="redo" class="icon" title="重做 Ctrl+Y" disabled>↷</button>
  <span class="sep"></span>
  <button id="addText" title="在画面中央插入一段文字">＋ 文字</button>
  <span class="sep"></span>
  <button id="zout" class="icon" title="缩小">−</button>
  <span id="zpct" style="min-width:44px;text-align:center">100%</span>
  <button id="zin" class="icon" title="放大">+</button>
  <button id="zfit" title="适应窗口">适应</button>
  <span id="status">载入中…</span>
  <button id="discard" disabled>放弃未保存</button>
  <button id="resetAll">全部还原</button>
  <button id="save" class="primary" disabled title="Ctrl+S">保存并重新出图</button>
</header>
<div class="filters"><span class="hint">点击可选中：</span><span id="chips"></span>
  <span class="sep"></span><span id="ovlChip" class="chip warn" title="把互相重叠的文字标成橙色">重叠检查</span>
  <span class="hint" style="margin-left:auto">Shift+点击多选 · 拖动自动吸附（按住 Alt 关闭）· 方向键微调 · Delete 隐藏 · Ctrl+滚轮缩放</span></div>
<aside><div id="layers"></div></aside>
<main id="main"><div id="board"><div id="stage"></div></div></main>
<aside class="right" id="props"></aside>
<script>
const PT_MM = 25.4 / 72;
const KINDS = { figure: "画布", axes: "图表", text: "文字", axislabel: "坐标轴标题", ticks: "刻度/类别标签", legend: "图例",
                scatter: "点", line: "线", patch: "形状", collection: "误差线/色带", image: "图片" };
const TAG = { figure: "画布", axes: "图表", text: "T", axislabel: "轴题", ticks: "刻度", legend: "图例", scatter: "点",
              line: "线", patch: "形", collection: "带", image: "图" };
const FILTERS = [["axes", "整个图表"], ["text", "文字"], ["axislabel", "坐标轴标题"], ["ticks", "刻度/类别"], ["legend", "图例"],
                 ["scatter", "点"], ["line", "线"], ["patch", "形状/色块"], ["collection", "误差线/色带"]];
const MOVABLE = new Set(["axes", "text", "axislabel", "ticks", "legend"]);
const TEXTY = new Set(["text", "axislabel"]);
const SIZED = new Set(["text", "axislabel", "ticks", "legend"]);
const LW = new Set(["line", "patch", "collection", "scatter", "axes"]);
const ALPHA = new Set(["text", "axislabel", "scatter", "line", "patch", "collection", "image"]);
const ANCHOR = { left: "start", center: "middle", right: "end" };
let svg, meta = {}, ids = {}, items = {}, stored = {}, cur = {}, undoS = [], redoS = [];
let sel = null, multi = new Set(), hover = null, drag = null, figInfo = {}, zoom = 1, activeColor = null, openGroups = new Set();
let showOverlap = false, lastWarn = "";
let enabled = { axes: false, text: true, axislabel: true, ticks: true, legend: true, scatter: true, line: true, patch: true,
                collection: true, image: true };
try { Object.assign(enabled, JSON.parse(localStorage.getItem("tw_filter3") || "{}")); } catch (e) {}
const $ = id => document.getElementById(id);
const stage = $("stage");
const clone = o => JSON.parse(JSON.stringify(o));
const setStatus = (s, warn) => { $("status").textContent = s; $("status").className = warn ? "warn" : ""; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (o, k, d) => (o && o[k] !== undefined && o[k] !== null ? o[k] : d);

// ---- filter chips --------------------------------------------------------------------------------------------------
function drawChips() {
  $("chips").innerHTML = "";
  for (const [k, name] of FILTERS) {
    const c = document.createElement("span");
    c.className = "chip" + (enabled[k] ? " on" : ""); c.textContent = name;
    c.onclick = () => { enabled[k] = !enabled[k]; if (k === "collection") enabled.image = enabled[k];
                        try { localStorage.setItem("tw_filter3", JSON.stringify(enabled)); } catch (e) {} drawChips(); };
    $("chips").appendChild(c);
  }
  $("ovlChip").className = "chip warn" + (showOverlap ? " on" : "");
}
$("ovlChip").onclick = () => { showOverlap = !showOverlap; drawChips(); drawBoxes(); if (svg) updateButtons(); };
drawChips();

// ---- loading -------------------------------------------------------------------------------------------------------
async function loadFigs() {
  figInfo = await fetch("/figs?" + Date.now()).then(r => r.json());
  $("figsel").innerHTML = figInfo.figs.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("");
  $("figsel").value = figInfo.current;
  document.title = (figInfo.figs.find(f => f[0] === figInfo.current) || [0, ""])[1] + " · 调图";
}
function prepEl(el, v) {
  el.querySelectorAll("text").forEach(t => t.dataset.orig = t.textContent);
  if (v.kind === "scatter")
    el.querySelectorAll("use, path").forEach(u => {
      if (u.tagName === "use") { u.dataset.cx = u.getAttribute("x"); u.dataset.cy = u.getAttribute("y"); }
      else { const b = u.getBBox(); u.dataset.cx = b.x + b.width / 2; u.dataset.cy = b.y + b.height / 2; }
    });
  else if (v.kind !== "ticks" || v.member !== undefined) {
    try { const b = el.getBBox(); el.dataset.cx = b.x + b.width / 2; el.dataset.cy = b.y + b.height / 2; } catch (e) {}
  }
}
async function load() {
  const [svgText, k, t] = await Promise.all([
    fetch("/svg?" + Date.now()).then(r => r.text()),
    fetch("/keys?" + Date.now()).then(r => r.json()),
    fetch("/tweaks?" + Date.now()).then(r => r.json())]);
  meta = k.meta || {}; ids = k.ids || k; stored = t; cur = clone(t); undoS = []; redoS = []; items = {};
  stage.innerHTML = svgText.replace(/^[\s\S]*?(<svg)/, "$1");
  svg = stage.querySelector("svg");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.querySelectorAll("[style]").forEach(e => e.dataset.os = e.getAttribute("style"));
  const Hmm = svg.viewBox.baseVal.height * PT_MM;
  for (const [id, v] of Object.entries(ids)) {
    const it = items[v.key] || (items[v.key] = Object.assign({ own: null, members: [] }, v, { member: undefined }));
    const el = svg.getElementById(id);
    if (v.member !== undefined) { it.members.push(id); if (el) el.dataset.member = v.member; }
    else it.own = id;
    if (!el) continue;
    prepEl(el, v);
    if (v.arrow) {                                     // leader line: the end away from the data point follows
      const a = svg.getElementById(id + "_arrow"), p = a && a.querySelector("path");
      if (p) {
        const L = p.getTotalLength(), p0 = p.getPointAtLength(0), p1 = p.getPointAtLength(L);
        const d0 = Math.hypot(p0.x - v.arrow[0], p0.y - v.arrow[1]), d1 = Math.hypot(p1.x - v.arrow[0], p1.y - v.arrow[1]);
        const T = d0 > d1 ? p0 : p1;
        it.arrowEl = id + "_arrow"; it.T = [T.x, T.y];
      }
    }
  }
  for (const it of Object.values(items)) if (it.kind === "axes") {
    const m = it.key.match(/^ax@(-?\d+),(-?\d+),(\d+),(\d+)/);
    if (!m) continue;
    const [x, y, w, h] = m.slice(1).map(Number), s = stored[it.key] || {};
    it.w = w; it.h = h; it.prefix = it.key.slice(0, -"/axes".length) + "/";
    it.ox = (x + (s.dx_mm || 0)) / PT_MM; it.oy = (Hmm - (y + h + (s.dy_mm || 0))) / PT_MM;
  }
  for (const key of Object.keys(cur)) if (key.startsWith("fig/added/") && !items[key]) addedPreview(key);
  if (sel && !items[sel.key]) sel = null;
  multi = new Set([...multi].filter(k => items[k]));
  if (!load.fitted) { fit(); load.fitted = true; } else applyZoom();
  preview(); drawLayers(); drawProps();
  setStatus(lastWarn || `${Object.keys(items).length} 个对象`, !!lastWarn);
}

// ---- inserted text -------------------------------------------------------------------------------------------------
function addedPreview(key) {                         // a text inserted here, shown until the next render draws it
  const a = (cur[key] || {}).add; if (!a) return;
  const H = svg.viewBox.baseVal.height, id = "twnew_" + key.split("/").pop();
  const old = svg.getElementById(id); if (old) old.remove();
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.id = id;
  const lines = String(a.text || "").split("\n");
  lines.forEach((ln, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", a.x_mm / PT_MM); t.setAttribute("y", H - a.y_mm / PT_MM + i * (a.size_pt || 7) * 1.2);
    t.setAttribute("style", `font-size: ${a.size_pt || 7}px; font-family: 'Arial'; text-anchor: start; fill: ${a.color || "#1b1b1b"}`);
    t.textContent = ln; g.appendChild(t);
  });
  svg.appendChild(g);
  g.querySelectorAll("[style]").forEach(e => e.dataset.os = e.getAttribute("style"));
  const v = { key, kind: "text", added: true, rotation: 0, ha: "left", colors: [a.color || "#1b1b1b"] };
  ids[id] = v; items[key] = Object.assign({ own: id, members: [], fresh: true }, v);
  prepEl(g, v);
}
$("addText").onclick = () => {
  const vb = svg.viewBox.baseVal, m = $("main").getBoundingClientRect(), s = svg.getBoundingClientRect();
  let cx = (m.left + m.width / 2 - s.left) / s.width * vb.width, cy = (m.top + m.height / 2 - s.top) / s.height * vb.height;
  if (!(cx > 0 && cx < vb.width && cy > 0 && cy < vb.height)) { cx = vb.width / 2; cy = vb.height / 2; }   // view centre, else page centre
  const key = "fig/added/" + Date.now().toString(36);
  push();
  cur[key] = { add: { text: "新文字", x_mm: +(Math.max(2, Math.min(vb.width - 20, cx)) * PT_MM).toFixed(2),
                      y_mm: +((vb.height - Math.max(10, Math.min(vb.height - 4, cy))) * PT_MM).toFixed(2), size_pt: 7, color: "#1b1b1b" } };
  addedPreview(key);
  select({ key, member: null });
  afterEdit();
  setTimeout(() => { const ta = document.querySelector("#props textarea"); if (ta) { ta.focus(); ta.select(); } }, 0);
};

// ---- zoom ----------------------------------------------------------------------------------------------------------
function applyZoom() {
  const vb = svg.viewBox.baseVal;
  svg.style.width = (vb.width * zoom) + "px"; svg.style.height = (vb.height * zoom) + "px";
  $("zpct").textContent = Math.round(zoom / 1.3333 * 100) + "%";     // 100% = print size on a 96-dpi screen
  drawBoxes();
}
function fit() { zoom = Math.max(0.5, Math.min(8, ($("main").clientWidth - 70) / svg.viewBox.baseVal.width)); applyZoom(); }
$("zin").onclick = () => { zoom = Math.min(10, zoom * 1.2); applyZoom(); };
$("zout").onclick = () => { zoom = Math.max(0.3, zoom / 1.2); applyZoom(); };
$("zfit").onclick = fit;

// ---- preview = rendered SVG + (current − stored) --------------------------------------------------------------------
function deltaMap(s, c) {
  const m = {};
  for (const k of new Set([...Object.keys(s || {}), ...Object.keys(c || {})])) {
    const from = ((s || {})[k] || k).toLowerCase(), to = ((c || {})[k] || k).toLowerCase();
    if (from !== to) m[from] = to;
  }
  return m;
}
function swapStyle(el, m, lwf) {
  let st = el.getAttribute("style"); if (!st) return;
  if (m && Object.keys(m).length) st = st.replace(/#[0-9a-fA-F]{6}\b/g, h => m[h.toLowerCase()] || h);
  if (lwf && lwf !== 1) st = st.replace(/stroke-width:\s*([\d.]+)/g, (_, w) => "stroke-width: " + (+w * lwf));
  el.setAttribute("style", st);
}
function scopeEls(it, frameOnly) {
  const out = [];
  const add = el => { if (!el) return; if (el.hasAttribute("style")) out.push(el); el.querySelectorAll("[style]").forEach(e => out.push(e)); };
  if (frameOnly) {                                    // a chart's frame: spines and tick marks
    const g = svg.getElementById(it.own); if (!g) return out;
    g.querySelectorAll(":scope > g[id^=patch], :scope > g[id^=matplotlib\\.axis] g[id^=line2d]").forEach(add);
    return out;
  }
  if (it.kind === "ticks") it.members.forEach(id => add(svg.getElementById(id)));
  else if (it.own) add(svg.getElementById(it.own));
  if (it.arrowEl) add(svg.getElementById(it.arrowEl));
  return out;
}
function previewStyle() {
  svg.querySelectorAll("[data-os]").forEach(e => e.setAttribute("style", e.dataset.os));
  svg.querySelectorAll("g[id^=tw_], g[id^=twnew_]").forEach(g => { g.style.opacity = ""; g.style.display = ""; });
  for (const it of Object.values(items)) {
    if (it.kind === "figure") continue;
    const s = stored[it.key] || {}, c = cur[it.key] || {};
    if (it.added && !cur[it.key]) { const g = svg.getElementById(it.own); if (g) g.style.display = "none"; continue; }
    const m = deltaMap(s.colors, c.colors), lwf = num(c, "lw", 1) / num(s, "lw", 1);
    if (Object.keys(m).length) scopeEls(it).forEach(e => swapStyle(e, m, 1));
    if (lwf !== 1) scopeEls(it, it.kind === "axes").forEach(e => swapStyle(e, null, lwf));
    const texts = it.kind === "ticks" ? it.members.map(id => svg.getElementById(id)).filter(Boolean) : [];
    if (it.kind === "ticks") {
      if (c.visible === false) texts.forEach(e => e.style.display = "none");
      if ((c.weight || "normal") !== (s.weight || "normal")) texts.forEach(e => e.querySelectorAll("text").forEach(t => t.style.fontWeight = c.weight || "normal"));
      continue;
    }
    const own = it.own && svg.getElementById(it.own);
    if (!own) continue;
    if (num(c, "alpha", 1) !== num(s, "alpha", 1)) own.style.opacity = num(c, "alpha", 1) / num(s, "alpha", 1);
    if (c.visible === false) own.style.display = "none";
    own.querySelectorAll("text").forEach(t => {
      if ((c.weight || "") !== (s.weight || "")) t.style.fontWeight = c.weight || "normal";
      if ((c.style || "") !== (s.style || "")) t.style.fontStyle = c.style || "normal";
      const ha = c.ha || it.ha, sha = s.ha || it.ha;
      if (ha && ha !== sha) t.style.textAnchor = ANCHOR[ha];
    });
    if (it.kind === "axes") {
      const bg = svg.getElementById(it.own + "_bg"), p = bg && bg.querySelector("path");
      if (p && (c.background !== s.background || c.background_alpha !== s.background_alpha)) {
        if (c.background || it.background !== "none") p.style.fill = c.background || it.background;
        p.style.fillOpacity = num(c, "background_alpha", 1);
      }
    }
  }
  const fi = items["fig/figure"];
  if (fi) {
    const s = stored[fi.key] || {}, c = cur[fi.key] || {};
    const m = deltaMap(s.colors, c.colors);
    if (Object.keys(m).length) svg.querySelectorAll("[style]").forEach(e => swapStyle(e, m, 1));
    const p = fi.own && svg.getElementById(fi.own) && svg.getElementById(fi.own).querySelector("path");
    if (p && c.background && c.background !== s.background) p.style.fill = c.background;
  }
}
function setLines(g, target) {                        // matplotlib writes one <text> per line
  if (!g) return;
  const ts = [...g.querySelectorAll("text")];
  if (!ts.length) return;
  if (target === null) { ts.forEach(t => { if (t.textContent !== t.dataset.orig) t.textContent = t.dataset.orig; }); return; }
  const lines = String(target).split("\n");
  ts.forEach((t, i) => {
    let want = i < lines.length ? lines[i] : "";
    if (i === ts.length - 1 && lines.length > ts.length) want = lines.slice(i).join(" ");
    if (t.textContent !== want) t.textContent = want;
  });
}
function textOf(it, o) {                              // the string a text item shows under settings o
  if (it.added) return ((o || {}).add || {}).text ?? "";
  return (o || {}).text !== undefined ? o.text : textFromKey(it.key);
}
function previewText() {
  for (const it of Object.values(items)) {
    const s = stored[it.key] || {}, c = cur[it.key] || {};
    if (TEXTY.has(it.kind)) {
      const now = textOf(it, c), was = it.fresh ? null : textOf(it, s);
      if (it.fresh && cur[it.key]) {                  // an inserted text: redraw its lines when their number changes
        const g = svg.getElementById(it.own);
        if (g && g.querySelectorAll("text").length !== String(now).split("\n").length) { addedPreview(it.key); continue; }
      }
      setLines(it.own && svg.getElementById(it.own), it.fresh ? now : (now === was ? null : now));
    } else if (it.kind === "ticks" || it.kind === "legend")
      for (const id of it.members) {
        const el = svg.getElementById(id); if (!el) continue;
        const mm = el.dataset.member, cr = (c.rename || {})[mm], sr = (s.rename || {})[mm];
        const now = cr !== undefined ? cr : mm, was = sr !== undefined ? sr : mm;
        setLines(el, now === was ? null : now);
      }
  }
}

    if (!(it.kind === "ticks" && it.axis === "x")) numField(b, "右移", num(c, "dx_mm", 0), 0.1, v => c.dx_mm = v);
    if (!(it.kind === "ticks" && it.axis === "y")) numField(b, "上移", num(c, "dy_mm", 0), 0.1, v => c.dy_mm = v);
    if (it.kind === "axes") {
      numField(b, "宽 增减", num(c, "dw_mm", 0), 0.5, v => c.dw_mm = v);
      numField(b, "高 增减", num(c, "dh_mm", 0), 0.5, v => c.dh_mm = v);
    }
    if (TEXTY.has(it.kind) || it.kind === "legend")
      btnRow(b, "居中于", [["图表水平", 0, () => { const r = rectOf(it.key), p = parentRect(it); push();
                                              nudgePx(it.key, (p.l + p.r) / 2 - (r.l + r.r) / 2, 0); afterEdit(); }, "移到所在图表（或整页）的水平中线"],
                          ["图表垂直", 0, () => { const r = rectOf(it.key), p = parentRect(it); push();
                                              nudgePx(it.key, 0, (p.t + p.b) / 2 - (r.t + r.b) / 2); afterEdit(); }, "移到所在图表（或整页）的垂直中线"]]);
  }
  if (SIZED.has(it.kind)) {
    const b = section("文字");
    if (TEXTY.has(it.kind))
      textField(b, "内容", textOf(it, c), v => {
        if (it.added) { c.add = Object.assign({}, c.add, { text: v }); return; }
        if (v === textFromKey(it.key)) delete c.text; else c.text = v; });
    if (sel.member) {
      const el = svg.getElementById(sel.member), m = el ? el.dataset.member : "";
      textField(b, "此项文字", (c.rename || {})[m] !== undefined ? c.rename[m] : m, v => {
        c.rename = Object.assign({}, c.rename || {}); if (v === m) delete c.rename[m]; else c.rename[m] = v; });
    } else if (it.kind === "ticks" || it.kind === "legend") {
      const l = document.createElement("span"); l.className = "hint"; l.style.gridColumn = "1 / 3";
      l.textContent = "要改某一项的文字：在图上点那一项。"; b.appendChild(l);
    }
    numField(b, "字号 ×", num(c, "size", 1), 0.05, v => c.size = v || 1);
    const bold = c.weight === "bold", ital = c.style === "italic";
    const styleBtns = [["B", bold, () => { push(); c.weight = bold ? "normal" : "bold"; afterEdit(); }, "加粗", "font-weight:700"]];
    if (TEXTY.has(it.kind)) styleBtns.push(["I", ital, () => { push(); c.style = ital ? "normal" : "italic"; afterEdit(); }, "斜体", "font-style:italic"]);
    btnRow(b, "样式", styleBtns);
    if (TEXTY.has(it.kind)) {
      const ha = c.ha || it.ha || "left";
      btnRow(b, "对齐", [["左", ha === "left", () => { push(); c.ha = "left"; afterEdit(); }, "左对齐（多行文字各行也左对齐）"],
                       ["中", ha === "center", () => { push(); c.ha = "center"; afterEdit(); }, "居中"],
                       ["右", ha === "right", () => { push(); c.ha = "right"; afterEdit(); }, "右对齐"]]);
    }
    if (TEXTY.has(it.kind) || it.kind === "ticks") {
      const r0 = num(c, "rotation", it.kind === "ticks" ? 0 : (it.rotation || 0));
      const rf = numField(b, "旋转 °", r0, 15, v => c.rotation = v);
      rf.title = "逆时针为正";
      btnRow(b, "", [["⟲ 90°", 0, () => { push(); c.rotation = (r0 + 90) % 360; afterEdit(); }, "逆时针转 90°"],
                    ["⟳ 90°", 0, () => { push(); c.rotation = (r0 + 270) % 360; afterEdit(); }, "顺时针转 90°"],
                    ["0°", 0, () => { push(); c.rotation = 0; afterEdit(); }, "转正"]]);
    }
  }
  if (it.kind === "scatter" || LW.has(it.kind) || ALPHA.has(it.kind)) {
    const b = section(it.kind === "axes" ? "边框" : it.kind === "scatter" ? "点与线" : "线条与透明度");
    if (it.kind === "scatter") numField(b, "点面积 ×", num(c, "scale", 1), 0.1, v => c.scale = v || 1);
    if (LW.has(it.kind)) numField(b, it.kind === "axes" ? "边框线宽 ×" : "线宽 ×", num(c, "lw", 1), 0.1, v => c.lw = v || 1);
    if (ALPHA.has(it.kind)) {
      const l = document.createElement("label"); l.textContent = "不透明度";
      const r = document.createElement("input"); r.type = "range"; r.min = 0.05; r.max = 1; r.step = 0.05; r.value = num(c, "alpha", 1);
      r.onchange = () => { push(); if (+r.value === 1) delete c.alpha; else c.alpha = +r.value; afterEdit(false); };
      b.append(l, r);
    }
  }
  if (it.kind === "axes") {
    const b = section("图表内部背景"); b.style.display = "block";
    const row = document.createElement("div"); row.className = "swatches";
    row.appendChild(swatch(c.background || (it.background === "none" ? "#ffffff" : it.background), { title: "当前背景" }));
    b.appendChild(row);
    b.appendChild(palettePicker(nc => { push(); c.background = nc.toLowerCase(); afterEdit(); }));
    const g = document.createElement("div"); g.className = "prop"; g.style.marginTop = "6px";
    const l = document.createElement("label"); l.textContent = "背景不透明度";
    const r = document.createElement("input"); r.type = "range"; r.min = 0; r.max = 1; r.step = 0.05; r.value = num(c, "background_alpha", 1);
    r.onchange = () => { push(); if (+r.value === 1) delete c.background_alpha; else c.background_alpha = +r.value; afterEdit(false); };
    g.append(l, r); b.appendChild(g);
    const n = document.createElement("div"); n.className = "hint"; n.style.marginTop = "4px";
    n.textContent = "图表里的色带、柱子等：上方勾选“形状/色块”或“误差线/色带”后直接点它们，改颜色和不透明度。"; b.appendChild(n);
  }
  colorSection("颜色", it.key, it.added ? [((c.add || {}).color || "#1b1b1b")] : it.colors,
               "点一个颜色再选新颜色；只改这个对象里用到该颜色的部分，其余颜色保持不变。");
  const b = document.createElement("div"); b.style.marginTop = "12px"; b.className = "btns";
  const rs = document.createElement("button"); rs.textContent = "还原此对象";
  rs.onclick = () => { push(); if (it.added) { const a = c.add; cur[it.key] = { add: a }; } else cur[it.key] = {}; afterEdit(); };
  b.appendChild(rs);
  if (it.added) {
    const del = document.createElement("button"); del.textContent = "删除这段文字";
    del.onclick = () => { push(); delete cur[it.key]; select(null); afterEdit(); };
    b.appendChild(del);
  }
  P.appendChild(b);
  drawLog();
}
function drawLog() {
  const h = document.createElement("h3"); h.textContent = "出图日志"; $("props").appendChild(h);
  const p = document.createElement("pre"); p.id = "log"; p.textContent = drawLog.text || "—"; $("props").appendChild(p);
}

// ---- edit history --------------------------------------------------------------------------------------------------
function normObj(o) {
  const r = {};
  for (const [k, v] of Object.entries(o || {})) {
    if (["dx_mm", "dy_mm", "dw_mm", "dh_mm"].includes(k) && Math.abs(v) < 1e-3) continue;
    if (["size", "scale", "lw"].includes(k) && Math.abs(v - 1) < 1e-3) continue;
    if ((k === "rename" || k === "colors") && !Object.keys(v).length) continue;
    if (k === "visible" && v === true) continue;
    r[k] = typeof v === "number" ? Math.round(v * 1000) / 1000 : v;
  }
  return r;
}
const sig = o => { const r = normObj(o); return JSON.stringify(Object.keys(r).sort().map(k => [k, r[k]])); };
const dirty = k => sig(cur[k]) !== sig(stored[k]);
const dirtyKeys = () => [...new Set([...Object.keys(cur), ...Object.keys(stored)])].filter(dirty);
function push() { undoS.push(clone(cur)); if (undoS.length > 300) undoS.shift(); redoS = []; }
function syncAdded() { for (const k of Object.keys(cur)) if (k.startsWith("fig/added/") && !items[k]) addedPreview(k); }
function undo() { if (!undoS.length) return; redoS.push(clone(cur)); cur = undoS.pop(); syncAdded(); afterEdit(); }
function redo() { if (!redoS.length) return; undoS.push(clone(cur)); cur = redoS.pop(); syncAdded(); afterEdit(); }
function updateButtons() {
  const any = dirtyKeys().length;
  $("save").disabled = !any; $("discard").disabled = !any;
  $("undo").disabled = !undoS.length; $("redo").disabled = !redoS.length;
  if (showOverlap && drawBoxes.nOvl !== undefined) setStatus(`${drawBoxes.nOvl} 处文字重叠` + (any ? `，${any} 处未保存` : ""), drawBoxes.nOvl > 0);
  else if (any) setStatus(`${any} 处未保存`);
  else if (/未保存/.test($("status").textContent)) setStatus("已是最新");
}

// ---- mouse and keyboard --------------------------------------------------------------------------------------------
const pxToMm = () => PT_MM / svg.getScreenCTM().a;
function startDrag(e, mode) {
  if (!sel) return;
  push();
  const keys = mode === "resize" ? [sel.key] : [...multi].filter(k => MOVABLE.has(items[k].kind));
  const start = Object.fromEntries(keys.map(k => { const c = curOf(k);
    return [k, { dx: num(c, "dx_mm", 0), dy: num(c, "dy_mm", 0), dw: num(c, "dw_mm", 0), dh: num(c, "dh_mm", 0) }]; }));
  const moving = new Set(keys);
  const r0 = rectOf(sel.key);
  const cand = { x: [], y: [] };                     // snap lines from everything else
  if (mode === "move" && r0) {
    for (const it of Object.values(items)) {
      if (moving.has(it.key) || !(TEXTY.has(it.kind) || it.kind === "legend" || it.kind === "axes")) continue;
      const el = it.kind === "axes" ? svg.getElementById(it.own + "_bg") : null;
      const b = el ? el.getBoundingClientRect() : rectOf(it.key); if (!b) continue;
      const r = el ? { l: b.left, t: b.top, r: b.right, b: b.bottom } : b;
      cand.x.push(r.l, (r.l + r.r) / 2, r.r); cand.y.push(r.t, (r.t + r.b) / 2, r.b);
    }
    const s = svg.getBoundingClientRect(); cand.x.push((s.left + s.right) / 2); cand.y.push((s.top + s.bottom) / 2);
  }
  drag = { mode, keys, start, x0: e.clientX, y0: e.clientY, r0, cand, moved: false };
  stage.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
}
function snap(drag, dxPx, dyPx, off) {
  if (off || !drag.r0) { showGuides([], []); return [dxPx, dyPx]; }
  const r = drag.r0, xs = [r.l + dxPx, (r.l + r.r) / 2 + dxPx, r.r + dxPx], ys = [r.t + dyPx, (r.t + r.b) / 2 + dyPx, r.b + dyPx];
  let bx = null, by = null;
  for (const x of xs) for (const c of drag.cand.x) if (Math.abs(c - x) < 5 && (!bx || Math.abs(c - x) < Math.abs(bx[0]))) bx = [c - x, c];
  for (const y of ys) for (const c of drag.cand.y) if (Math.abs(c - y) < 5 && (!by || Math.abs(c - y) < Math.abs(by[0]))) by = [c - y, c];
  showGuides(bx ? [bx[1]] : [], by ? [by[1]] : []);
  return [dxPx + (bx ? bx[0] : 0), dyPx + (by ? by[0] : 0)];
}
stage.addEventListener("pointerdown", e => {
  if (e.target.classList.contains("handle")) return;
  const p = pick(e);
  if (e.shiftKey) { if (p) select(p, true); return; }
  if (!(p && multi.has(p.key) && multi.size > 1)) select(p);
  else { sel = p; drawBoxes(); }
  if (p && MOVABLE.has(items[p.key].kind)) startDrag(e, "move");
});
stage.addEventListener("pointermove", e => {
  if (drag) {
    const k = pxToMm();
    drag.moved = true;
    if (drag.mode === "resize") {
      const c = curOf(drag.keys[0]), st = drag.start[drag.keys[0]];
      c.dw_mm = st.dw + (e.clientX - drag.x0) * k; c.dh_mm = st.dh + (e.clientY - drag.y0) * k;
    } else {
      const [dxp, dyp] = snap(drag, e.clientX - drag.x0, e.clientY - drag.y0, e.altKey);
      for (const key of drag.keys) {
        const it = items[key], c = curOf(key), st = drag.start[key];
        if (!(it.kind === "ticks" && it.axis === "x")) c.dx_mm = st.dx + dxp * k;
        if (!(it.kind === "ticks" && it.axis === "y")) c.dy_mm = st.dy - dyp * k;
      }
    }
    previewGeom(); return;
  }
  const h = pick(e);
  if ((h && h.key) !== (hover && hover.key)) { hover = h; drawBoxes(); }
});
stage.addEventListener("pointerup", () => {
  if (!drag) return;
  showGuides([], []);
  if (!drag.moved) undoS.pop();
  drag = null; afterEdit();
});
function scaleSel(f) {
  const ks = multi.size ? [...multi] : sel ? [sel.key] : [];
  if (!ks.length) return;
  push();
  let any = false;
  for (const key of ks) {
    const it = items[key], c = curOf(key);
    if (it.kind === "axes") { c.dw_mm = (it.w + num(c, "dw_mm", 0)) * f - it.w; c.dh_mm = (it.h + num(c, "dh_mm", 0)) * f - it.h; }
    else if (it.kind === "scatter") c.scale = num(c, "scale", 1) * f;
    else if (SIZED.has(it.kind)) c.size = num(c, "size", 1) * f;
    else if (LW.has(it.kind)) c.lw = num(c, "lw", 1) * f;
    else continue;
    any = true;
  }
  if (!any) { undoS.pop(); return; }
  afterEdit();
}
$("main").addEventListener("wheel", e => {
  if (e.ctrlKey) { e.preventDefault(); zoom = Math.max(0.3, Math.min(10, zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1))); applyZoom(); return; }
  if (!sel) return;
  const r = rectOf(sel.key);
  if (!r || e.clientX < r.l || e.clientX > r.r || e.clientY < r.t || e.clientY > r.b) return;
  e.preventDefault(); scaleSel(e.deltaY < 0 ? 1.05 : 1 / 1.05);
}, { passive: false });
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("save").disabled) $("save").click(); return; }
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { redo(); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { undo(); e.preventDefault(); return; }
  if (e.key === "Escape") { select(null); return; }
  if (!sel) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    push(); for (const k of multi) { if (items[k].added) delete cur[k]; else curOf(k).visible = false; }
    select(null); afterEdit(); e.preventDefault(); return;
  }
  if (e.key === "+" || e.key === "=") { scaleSel(1.05); e.preventDefault(); return; }
  if (e.key === "-" || e.key === "_") { scaleSel(1 / 1.05); e.preventDefault(); return; }
  const s = e.shiftKey ? 0.5 : 0.1;
  const d = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, s], ArrowDown: [0, -s] }[e.key];
  if (!d) return;
  const ks = [...multi].filter(k => MOVABLE.has(items[k].kind)); if (!ks.length) return;
  e.preventDefault(); push();
  for (const key of ks) {
    const it = items[key], c = curOf(key);
    if (!(it.kind === "ticks" && it.axis === "x")) c.dx_mm = num(c, "dx_mm", 0) + d[0];
    if (!(it.kind === "ticks" && it.axis === "y")) c.dy_mm = num(c, "dy_mm", 0) + d[1];
  }
  afterEdit(false);
});

// ---- server --------------------------------------------------------------------------------------------------------
async function post(path, body) {
  setStatus("重新出图中…");
  document.querySelectorAll("header button, header select").forEach(b => b.disabled = true);
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json());
  drawLog.text = r.log;
  const stale = (r.log.match(/tweaks: (\d+) entr(?:y|ies) match no artist/) || [])[1];
  lastWarn = !r.log.startsWith("OK") ? "出图出错，见右侧日志" : stale ? `已出图；${stale} 处调整找不到对象（文字被脚本改过？），见日志` : "";
  await loadFigs(); await load();
  document.querySelectorAll("header button, header select").forEach(b => b.disabled = false);
  updateButtons(); drawProps();
  setStatus(lastWarn || "已保存并重新出图", !!lastWarn);
  lastWarn = "";
}
$("save").onclick = () => {
  const out = {};
  for (const k of dirtyKeys()) { const o = normObj(cur[k]); out[k] = Object.keys(o).length ? o : null; }
  post("/save", out);
};
$("undo").onclick = undo; $("redo").onclick = redo;
$("discard").onclick = () => { push(); cur = clone(stored); afterEdit(); };
$("resetAll").onclick = () => { if (confirm("清除这张图的全部手动调整（包括插入的文字）并重新出图？")) post("/reset_all", {}); };
$("figsel").onchange = async () => {
  if (dirtyKeys().length && !confirm("有未保存的调整，切换会放弃它们。继续？")) { $("figsel").value = figInfo.current; return; }
  sel = null; multi = new Set(); hover = null; load.fitted = false; openGroups = new Set(); setStatus("切换中…");
  await fetch("/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fig: $("figsel").value }) });
  await loadFigs(); await load(); updateButtons();
};
window.addEventListener("resize", drawBoxes);
window.addEventListener("beforeunload", e => { if (dirtyKeys().length) { e.preventDefault(); e.returnValue = ""; } });
loadFigs().then(load).then(updateButtons);
</script>
