      - 3.4974
      - 0.4485
      - 0.1074
      A_min_m3: 0.3
      A_max_m3: 520.0
      extrapolation_exponent: 0.6
      B2: 1.82
      Fm: 1.0
      L_over_D: 3.0
      allowable_stress_x_weld_eff_bar: 850.0
      corrosion_allowance_m: 0.00315
      min_thickness_m: 0.0063
      note: premium = Cp0(V)*B2*Fm*(Fp-1); Fp=max(t/t_min,1); t=P*D/(2(SE-0.6P))+CA;
