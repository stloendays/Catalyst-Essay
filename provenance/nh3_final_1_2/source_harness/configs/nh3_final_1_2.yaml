project:
  name: Catalyst Economic Leverage
  reaction: NH3
  harness_version: 0.2.0
  model_version: NH3-FINAL-1.2
  run_label: nh3_final_1_2
  scientific_scope: 'NH3-FINAL-1.1 on one experimental thermodynamic basis: NH3 formation
    free energy from the Gillespie-Beattie equilibrium constant and Newton-Cooper
    fugacity coefficients for N2, H2 and NH3, used alike in the loop equilibrium and
    in the microkinetic gas activities; fused-iron calibration redone on its 1.1 definition.
    Workbook, scaling relations, process grid, economics, bed cap and uncertainty
    settings are those of 1.1.'
