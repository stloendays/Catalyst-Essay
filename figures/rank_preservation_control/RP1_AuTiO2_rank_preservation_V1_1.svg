<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 34px Arial,Helvetica,sans-serif;fill:#111827}
    .subtitle{font:400 19px Arial,Helvetica,sans-serif;fill:#4b5563}
    .head{font:700 22px Arial,Helvetica,sans-serif;fill:#111827}
    .label{font:600 19px Arial,Helvetica,sans-serif;fill:#111827}
    .small{font:400 16px Arial,Helvetica,sans-serif;fill:#4b5563}
    .metric{font:700 22px Arial,Helvetica,sans-serif;fill:#0f766e}
    .note{font:400 17px Arial,Helvetica,sans-serif;fill:#374151}
  </style>

  <text x="70" y="65" class="title">Rank preservation under a monotonic downstream mapping</text>
  <text x="70" y="98" class="subtitle">Au/TiO₂ CO oxidation, literature-calibrated fixed-condition control (V1.1)</text>

  <rect x="65" y="135" width="1270" height="590" rx="18" fill="#f9fafb" stroke="#d1d5db"/>

  <text x="165" y="185" class="head">Intrinsic activity rank</text>
  <text x="165" y="214" class="small">higher mass activity = better</text>
  <text x="975" y="185" class="head">Downstream burden rank</text>
  <text x="975" y="214" class="small">lower catalyst requirement = better</text>

  <!-- rank guide lines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="130" y1="280" x2="1270" y2="280"/>
    <line x1="130" y1="365" x2="1270" y2="365"/>
    <line x1="130" y1="450" x2="1270" y2="450"/>
    <line x1="130" y1="535" x2="1270" y2="535"/>
    <line x1="130" y1="620" x2="1270" y2="620"/>
  </g>

  <!-- straight rank-preserving connectors -->
  <g fill="none" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M430 280 C600 280,800 280,970 280" stroke="#0f766e"/>
    <path d="M430 365 C600 365,800 365,970 365" stroke="#2563eb"/>
    <path d="M430 450 C600 450,800 450,970 450" stroke="#7c3aed"/>
    <path d="M430 535 C600 535,800 535,970 535" stroke="#b45309"/>
    <path d="M430 620 C600 620,800 620,970 620" stroke="#6b7280"/>
  </g>

  <!-- left nodes and values -->
  <g>
    <circle cx="410" cy="280" r="15" fill="#0f766e"/><text x="165" y="288" class="label">2 nm</text><text x="250" y="288" class="small">9.6548 μmol CO gcat⁻¹ s⁻¹</text>
    <circle cx="410" cy="365" r="15" fill="#2563eb"/><text x="165" y="373" class="label">3 nm</text><text x="250" y="373" class="small">4.4686 μmol CO gcat⁻¹ s⁻¹</text>
    <circle cx="410" cy="450" r="15" fill="#7c3aed"/><text x="165" y="458" class="label">4 nm</text><text x="250" y="458" class="small">2.5869 μmol CO gcat⁻¹ s⁻¹</text>
    <circle cx="410" cy="535" r="15" fill="#b45309"/><text x="165" y="543" class="label">5 nm</text><text x="250" y="543" class="small">1.6930 μmol CO gcat⁻¹ s⁻¹</text>
    <circle cx="410" cy="620" r="15" fill="#6b7280"/><text x="165" y="628" class="label">6 nm</text><text x="250" y="628" class="small">1.1973 μmol CO gcat⁻¹ s⁻¹</text>
  </g>

  <!-- right nodes and values -->
  <g>
    <circle cx="990" cy="280" r="15" fill="#0f766e"/><text x="1020" y="276" class="label">2 nm</text><text x="1020" y="300" class="small">19.505 mg catalyst · 1.000× burden</text>
    <circle cx="990" cy="365" r="15" fill="#2563eb"/><text x="1020" y="361" class="label">3 nm</text><text x="1020" y="385" class="small">42.143 mg · 2.161×</text>
    <circle cx="990" cy="450" r="15" fill="#7c3aed"/><text x="1020" y="446" class="label">4 nm</text><text x="1020" y="470" class="small">72.797 mg · 3.732×</text>
    <circle cx="990" cy="535" r="15" fill="#b45309"/><text x="1020" y="531" class="label">5 nm</text><text x="1020" y="555" class="small">111.235 mg · 5.703×</text>
    <circle cx="990" cy="620" r="15" fill="#6b7280"/><text x="1020" y="616" class="label">6 nm</text><text x="1020" y="640" class="small">157.284 mg · 8.064×</text>
  </g>

  <text x="700" y="690" text-anchor="middle" class="metric">ρ = 1.000 · τ = 1.000 · 0 pairwise inversions</text>

  <rect x="65" y="755" width="1270" height="95" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="90" y="792" class="note">Literature recalibration weakened the size effect substantially:</text>
  <text x="90" y="825" class="label">6 nm / 2 nm required-mass ratio 19.42× → 8.064× (−58.5%), while the full ranking remained unchanged.</text>
</svg>
