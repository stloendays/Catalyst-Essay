name: NH3 industrial validation failure triage (read-only)
on:
  pull_request:
    paths:
      - ".github/workflows/nh3-industrial-validation-triage.yml"
      - "analysis/nh3_industrial_validation_2026_10_14/**"
      - "analysis/validation_nh3_plant_2026_10_13/**"
      - "provenance/nh3_final_1_2/**"
  push:
    branches:
      - "audit/nh3-industrial-failure-triage-2026-10-14"
    paths:
      - ".github/workflows/nh3-industrial-validation-triage.yml"
      - "analysis/nh3_industrial_validation_2026_10_14/**"
  workflow_dispatch:
    inputs:
      full_recompute:
        description: "Re-execute NH3-FINAL-1.2 plant simulation (~10 min) and compare all 64 scores"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nh3-industrial-triage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forensic:
    name: Evidence-pinned independent score and failure triage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit source and baseline pins, judge 64 metrics independently
        run: python analysis/nh3_industrial_validation_2026_10_14/audit_industrial.py --out-dir artifacts/nh3-industrial-triage
      - name: Source-conditioned S-200 bed-specific mismatch
        run: python analysis/nh3_industrial_validation_2026_10_14/diagnose_bed_profile.py --out-dir artifacts/nh3-bed-profiles
      - name: Falsification tests
        run: python -m unittest discover -s analysis/nh3_industrial_validation_2026_10_14 -p 'test_*.py' -v
      - name: Upload report (not an industrial validation certificate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh3-industrial-triage
          path: artifacts/nh3-industrial-triage/
          retention-days: 90
      - name: Upload S-200 bed mismatch diagnostic (not refitted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh3-s200-bed-mismatch
          path: artifacts/nh3-bed-profiles/
          retention-days: 90
      - name: Assert frozen inputs and manuscript untouched
        run: git diff --exit-code -- provenance/ docs/ data/ analysis/validation_nh3_plant_2026_10_13/

  separator-vle:
    name: NH3 source-grounded separator vapor test (noncanonical)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      NH3_MODEL: "1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark-source physics dependencies
        run: pip install "numpy==2.3.5" "scipy==1.18.0" "pandas>=2.0" "pyyaml>=6" "openpyxl>=3.1"
      - name: Reconstruct 28 Ullmann/BASF source data and propagate separator vapor without refitting
        run: python analysis/nh3_industrial_validation_2026_10_14/diagnose_separator_vle.py --out-dir artifacts/nh3-separator-vle --propagate
      - name: Unit tests for source-only interpolation and falsification
        run: python -m unittest discover -s analysis/nh3_industrial_validation_2026_10_14 -p 'test_vle_diagnostic.py' -v
      - name: Upload conditional outputs (not revised registered scores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh3-separator-vle-conditional
          path: artifacts/nh3-separator-vle/
          retention-days: 90
      - name: Check canonical science inputs unchanged
        run: git diff --exit-code -- provenance/ docs/ data/ analysis/validation_nh3_plant_2026_10_13/

  full-recompute:
    name: Recompute NH3-FINAL-1.2 on source model and compare all 64 metrics
    if: github.event_name == 'workflow_dispatch' && inputs.full_recompute == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      NH3_MODEL: "1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen-compatible numerical dependencies
        run: pip install "numpy==2.3.5" "scipy==1.18.0" "pandas>=2.0" "pyyaml>=6" "openpyxl>=3.1"
      - name: Preserve baseline for independent comparison
        run: |
          mkdir -p /tmp/nh3-registered-snapshot
          cp analysis/validation_nh3_plant_2026_10_13/nh3_1_2/results_metrics.csv /tmp/nh3-registered-snapshot/results_metrics.csv
          cp analysis/validation_nh3_plant_2026_10_13/nh3_1_2/summary.json /tmp/nh3-registered-snapshot/summary.json
      - name: Reproduce canonical optima first
        run: python analysis/nh3_industrial_validation_2026_10_14/bootstrap_replay.py test
      - name: Recompute industrial benchmark on NH3-FINAL-1.2
        run: python analysis/nh3_industrial_validation_2026_10_14/bootstrap_replay.py benchmark --workers 1
      - name: Audit recomputation against preserved committed 64 verdicts
        run: |
          python analysis/nh3_industrial_validation_2026_10_14/audit_industrial.py --out-dir artifacts/nh3-industrial-replay --snapshot /tmp/nh3-registered-snapshot/results_metrics.csv --summary-snapshot /tmp/nh3-registered-snapshot/summary.json --recomputed analysis/validation_nh3_plant_2026_10_13/nh3_1_2/results_metrics.csv
      - name: Assert no frozen or manuscript modifications
        run: git diff --exit-code -- provenance/ docs/ data/
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh3-industrial-triage-replay
          path: |
            artifacts/nh3-industrial-replay/
            analysis/validation_nh3_plant_2026_10_13/nh3_1_2/run_benchmark_stdout.txt
          retention-days: 90
