name: Supervisor MeOH workbook inspect

on:
  push:
    paths:
      - '.github/workflows/supervisor-meoh-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Inspect workbook structure and formulas
        run: |
          python - <<'PY'
          import json, openpyxl
          from pathlib import Path
          p=Path('data/meoh/MeOH_D01_ExplicitRecycleSeparationEconomics_v3.0.xlsx')
          wf=openpyxl.load_workbook(p,data_only=False,read_only=True)
          wv=openpyxl.load_workbook(p,data_only=True,read_only=True)
          print('SHEETS', json.dumps([(s,wf[s].max_row,wf[s].max_column) for s in wf.sheetnames]))
          for s in wf.sheetnames:
              print('\n### SHEET',s,'rows',wf[s].max_row,'cols',wf[s].max_column)
              maxr=min(wf[s].max_row,60)
              maxc=min(wf[s].max_column,30)
              for r in range(1,maxr+1):
                  vals=[]
                  nonempty=False
                  for c in range(1,maxc+1):
                      f=wf[s].cell(r,c).value
                      v=wv[s].cell(r,c).value
                      if f is not None or v is not None:
                          nonempty=True
                      if isinstance(f,str) and f.startswith('='):
                          vals.append({'c':wf[s].cell(r,c).coordinate,'f':f,'v':v})
                      elif f is not None:
                          vals.append({'c':wf[s].cell(r,c).coordinate,'v':v})
                  if nonempty:
                      print(json.dumps({'r':r,'cells':vals},ensure_ascii=False,default=str))
          PY
