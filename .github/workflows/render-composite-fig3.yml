name: Render composite Figure 3

on:
  push:
    branches: [main]
    paths:
      - "figures/composite/fig3/make_fig3.py"
      - "figures/composite/style.py"
      - "analysis/fe_bridge_backward_2026_09_29/activity_lifecycle_certified_boundary.csv"
      - "analysis/fe_bridge_backward_2026_09_29/activity_lifecycle_target_keypoints.csv"
      - "analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_global_boundary.csv"
      - "analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_keypoints.csv"
      - "analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_summary.json"
      - "analysis/supervisor_2026_09_20/nh3_cost_mc_summary.json"
      - "provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/closure/breakeven_sweep.csv"
      - "provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/closure/scaling_reachability.csv"
      - "provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/results.json"
      - ".github/workflows/render-composite-fig3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib

      - name: Render Figure 3
        run: python figures/composite/fig3/make_fig3.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: composite-fig3-preview
          path: figures/composite/fig3/Fig3.png
          retention-days: 7

      - name: Build render manifest
        run: |
          {
            echo "# Composite Figure 3 render manifest — 2026-09-29"
            sha256sum               figures/composite/fig3/Fig3.svg               figures/composite/fig3/Fig3.pdf               figures/composite/fig3/Fig3.png               figures/composite/fig3/make_fig3.py               analysis/fe_bridge_backward_2026_09_29/activity_lifecycle_certified_boundary.csv               analysis/fe_bridge_backward_2026_09_29/activity_lifecycle_target_keypoints.csv               analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_global_boundary.csv               analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_keypoints.csv               analysis/fe_bridge_backward_2026_09_29/scaling_lifecycle_exact_summary.json               analysis/supervisor_2026_09_20/nh3_cost_mc_summary.json               provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/closure/breakeven_sweep.csv               provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/closure/scaling_reachability.csv               provenance/nh3_final_1_1/source_harness/outputs/nh3_final_20260905T134204Z/results.json
          } > figures/composite/FIG3_RENDER_SHA256.txt

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/composite/fig3/Fig3.svg figures/composite/fig3/Fig3.pdf figures/composite/fig3/Fig3.png figures/composite/FIG3_RENDER_SHA256.txt
          if git diff --cached --quiet; then
            echo "No render changes."
          else
            git commit -m "figures: render four-layer backward-design Figure 3"
            target="main"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "$target" && git push origin HEAD:"$target"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt lost a race; retrying"
              sleep $((attempt + 2))
            done
            [ "$pushed" = 1 ] || { echo "could not push after 5 attempts"; exit 1; }
          fi
