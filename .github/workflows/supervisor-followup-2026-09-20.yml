name: Supervisor follow-up analysis

on:
  push:
    branches: [main]
    paths:
      - 'analysis/supervisor_2026_09_20/**'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/supervisor_2026_09_20/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl numpy scipy pyyaml matplotlib
      - run: python analysis/supervisor_2026_09_20/inspect_meoh_workbook.py
      - name: Commit generated inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supervisor_2026_09_20/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "analysis: inspect MeOH workbook for cost-MC extension"
            # Several jobs can be in flight at once; a bare push loses the race
            # and throws away a run whose checks already passed.
            target="$(git rev-parse --abbrev-ref HEAD)"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "$target" && git push origin HEAD:"$target"; then
                pushed=1; break
              fi
              echo "push attempt $attempt lost a race with another job; retrying"
              sleep $(( (RANDOM % 5) + 2 ))
            done
            [ "$pushed" = 1 ] || { echo "could not push after 5 attempts"; exit 1; }
          fi
