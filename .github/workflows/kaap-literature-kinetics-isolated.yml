name: KAAP literature kinetics isolated diagnostic
on:
  push:
    branches:
      - experiment/kaap-fe-ru-20261012-literature-kinetics
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy matplotlib pytest
      - name: Physics and regression tests
        working-directory: analysis/kaap_fe_ru_kinetics_2026_10_12
        run: python -m pytest -q test_model.py test_v2.py
      - name: Recompute isolated parameter scans
        working-directory: analysis/kaap_fe_ru_kinetics_2026_10_12
        run: python run_v2.py
      - name: Render unfrozen source-kinetics figures
        working-directory: analysis/kaap_fe_ru_kinetics_2026_10_12
        run: python figure_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: kaap-literature-kinetics-unfrozen
          path: analysis/kaap_fe_ru_kinetics_2026_10_12/results_v2/
