name: One-time cancel orphaned NH3 replay
on:
  push:
    branches:
      - audit/nh3-industrial-failure-triage-2026-10-14
    paths:
      - .github/workflows/nh3-orphan-replay-cancel.yml

permissions:
  actions: write

jobs:
  cancel-hung-spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop known run with repeated spawn/import errors
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=38514853028
          status=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.status')
          echo "Source run status: ${status}"
          if [ "${status}" != "completed" ]; then
            gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
            echo "Requested cancellation of orphaned multiprocessing run."
          else
            echo "Old run already finished; no action required."
          fi
