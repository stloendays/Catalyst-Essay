name: Figure 8 R reference render

# The canonical Figure 8 is the Origin build promoted on 2026-09-23; its inputs,
# build scripts and outputs are pinned in figures/meoh/F08_RENDER_SHA256.txt and
# verified on every push by render-manifests.yml.
#
# The R renderer (figures/meoh/render_F08_selectivity_recycle.R) is kept as the
# fully scriptable reference implementation of the same frozen design: Origin is
# not available on a CI runner, R is. This job confirms that the reference still
# renders from the frozen D01 v3 inputs on a clean checkout, and uploads what it
# draws. It renders into a scratch tree and never writes to figures/.
#
# History: the R render was the canonical asset from 2026-09-10 (CI run
# 34449914480 of closure-f9a-f8.yml) until the promotion. No byte comparison is
# made against the committed files, since they now come from a different renderer.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figures/meoh/render_F08_selectivity_recycle.R'
      - 'data/meoh/meoh_candidate_ranking_D01v3.csv'
      - 'data/meoh/meoh_purge_robustness_D01v3.csv'
      - '.github/workflows/f8-render-repro.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core
          Rscript -e 'cat(R.version.string, "\n")' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render the reference from the frozen inputs into a scratch tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref/data/meoh /tmp/ref/figures/meoh
          cp data/meoh/meoh_candidate_ranking_D01v3.csv \
             data/meoh/meoh_purge_robustness_D01v3.csv \
             /tmp/ref/data/meoh/
          Rscript figures/meoh/render_F08_selectivity_recycle.R /tmp/ref
          for f in svg pdf png; do
            test -s "/tmp/ref/figures/meoh/F08_MeOH_selectivity_recycle_D01v3.$f"
          done
          echo "R reference render completed from the frozen inputs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reference render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-r-reference-render
          path: /tmp/ref/figures/meoh/
          if-no-files-found: error
