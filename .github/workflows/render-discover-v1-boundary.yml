name: Render DISCOVER V1 boundary figures

on:
  push:
    branches:
      - analysis/discover-v1-boundary-20260908
    paths:
      - data/discover_v1_boundary_reanalysis.py
      - data/cross_model_scores_2026-09-06.csv
      - .github/workflows/render-discover-v1-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip pandas matplotlib

      - name: Rebuild diagnostics and figures from frozen aggregate data
        run: python data/discover_v1_boundary_reanalysis.py

      - name: Commit rendered figures and regenerated tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            figures/discover_v1_delta_pfull_vs_budget.png \
            figures/discover_v1_strong_compute_saving_vs_budget.png \
            data/discover_v1_boundary_diagnostics_2026-09-08.csv \
            data/discover_v1_strong_efficiency_diagnostics_2026-09-08.csv
          if git diff --cached --quiet; then
            echo "No rendered-output changes to commit."
          else
            git commit -m "Render DISCOVER V1 boundary figures"
            git push origin HEAD:${{ github.ref_name }}
          fi
