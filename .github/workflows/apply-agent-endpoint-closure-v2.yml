name: Apply Agent endpoint-definition closure v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-agent-endpoint-closure-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize current-facing Agent documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          # Manuscript v6 from preserved v5.
          m = Path('docs/MANUSCRIPT_SKELETON_v5_2026-09-17.md').read_text(encoding='utf-8')
          m = replace_once(
              m,
              "DISCOVER V1 asks whether an AI agent can direct limited scientific compute to the parts of the multiscale chain that decide the industrial outcome. The protocol and its A–D baselines were frozen before any cross-model evaluation. A complete decision requires the economic winner, the decision pair, the backward target and the reachability verdict; recovery was **6/35** for nano, **15/35** for mini and **35/35** for the strong model, with a pooled tier trend of **Z = 6.95**. The pre-registered hypothesis that adaptive policy E would outperform fixed-VOI policy D across tiers was not supported. The DISCOVER-BOUNDARY-C1 extension keeps this frozen environment and instead resolves the budget boundary against a deterministic D that completes at **206 CU**.",
              "DISCOVER V1 asks whether an AI agent can direct limited scientific compute to the parts of the multiscale chain that decide the industrial outcome. The protocol and its A–D baselines were frozen before any cross-model evaluation. The frozen primary endpoint defines a complete decision as the correct economic winner, correct decision pair and correct reachability verdict: `full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct`. The workflow still uses `BACKWARD` to construct the evidence needed for reachability, but numerical recovery of the backward parity multiplier is evaluated separately as a secondary quantitative endpoint. Complete-decision recovery was **6/35** for nano, **15/35** for mini and **35/35** for the strong model, with a pooled tier trend of **Z = 6.95**. The pre-registered hypothesis that adaptive policy E would outperform fixed-VOI policy D across tiers was not supported. The DISCOVER-BOUNDARY-C1 extension keeps this frozen environment and instead resolves the budget boundary against a deterministic D that completes at **206 CU**.",
              'manuscript endpoint')

          old = "At **50 CU** completion breaks to **13/20**, making 75 CU the lowest stable completion threshold. The 50 CU failures are affordability failures on the closing link, not reasoning failures: winner and decision pair are still 20/20, and six of seven incomplete runs execute `BACKWARD` but cannot afford the 2–4 CU reachability classification. The mandatory action spine places a hard floor between roughly 35 and 50 CU."
          new = old + "\n\nDecision-level convergence and quantitative-target convergence separate cleanly. Under the frozen first-record scoring convention, the canonical Ru→Fe parity multiplier **201.223443×** is recovered in **9/20** runs at 75 CU, **9/20** at 100 CU, **11/20** at 125 CU, **11/20** at 150 CU, **15/20** at 175 CU and **20/20** at 225 CU. Thus **75 CU is the lowest tested stable complete-decision budget**, whereas **225 CU is the lowest tested budget with 20/20 canonical backward-target recovery**. The separation shows that the industrial decision can converge before the quantitative design target does; a noncanonical parity estimate can still support the same reachability verdict when it remains on the same side of the frozen **2.5246×** headroom."
          m = replace_once(m, old, new, 'manuscript thresholds')

          m = replace_once(
              m,
              "Completeness and pre-registration deviations are reported with the result. Phase B was a cost-motivated reduced extension at the two discriminative cells, 175 and 225 CU (80/80 formal runs, 0 smoke runs, 0 infrastructure retries, 0 driver exceptions); the reduction from the registered five-budget design and the no-smoke decision were both made before the first Phase B API call and must not be presented as the pre-registered design. The 2026-09-11/12 extension adds 173 formal runs, for a C1 total of **317 scored runs**, with frozen hashes **15/15 PASS** before and after every batch. One batch was aborted by API credit exhaustion; its 17 quarantined traces — 16 with zero steps and one truncated at step 11 — yielded no result.",
              "Protocol execution and sampling completeness are reported with the result. The weak-tier transfer arm evaluated the two discriminative cells at **175 and 225 CU**, which straddle D's 206-CU threshold (**80/80 formal runs**, 0 smoke runs, 0 infrastructure retries, 0 driver exceptions). The 2026-09-11/12 extension adds 173 formal runs, for a C1 total of **317 scored runs**, with frozen hashes **15/15 PASS** before and after every batch. One batch was interrupted by API credit exhaustion; its 17 quarantined traces — 16 with zero steps and one truncated at step 11 — yielded no result.",
              'manuscript execution wording')

          old = "The agent results are best stated as an operating envelope rather than as an efficiency claim, because three properties that are easy to conflate separate cleanly in the frozen benchmark."
          m = replace_once(m, old, old + " Decision-level convergence and quantitative-target convergence are distinct within that envelope: the lowest tested stable complete-decision budget is **75 CU**, whereas the lowest tested budget with **20/20** recovery of the canonical backward parity multiplier is **225 CU**.", 'discussion thresholds')

          m = replace_once(
              m,
              "13. Decision-aware AI harness, frozen DISCOVER V1 cross-model benchmark, and DISCOVER-BOUNDARY-C1 confirmatory boundary extension. Report the unchanged 11-action scientific interface, CU accounting, anonymous task, fixed scorer/stopping rule, deterministic D reference, per-tier repeated sampling, step-level `CU_to_full_decision` reconstruction, narrow-window behavior, before/after frozen-hash checks, and the Phase-B design reduction recorded in addendum A2.",
              "13. Decision-aware AI harness, frozen DISCOVER V1 cross-model benchmark, and DISCOVER-BOUNDARY-C1 confirmatory boundary extension. Report the unchanged 11-action scientific interface, CU accounting, anonymous task, fixed scorer/stopping rule, deterministic D reference, per-tier repeated sampling, and the frozen primary endpoint `full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct`. Report backward parity-multiplier accuracy separately as a secondary quantitative endpoint, together with the distinct 75-CU decision-recovery and 225-CU canonical-target thresholds, step-level `CU_to_full_decision` reconstruction, narrow-window behavior, before/after frozen-hash checks, and the boundary-targeted weak-tier execution record.",
              'methods wording')

          m = replace_once(
              m,
              "- DISCOVER-BOUNDARY-C1 175/225-CU boundary tables, Wilson intervals, narrow-window usage, failure taxonomy and Phase-B addendum A2",
              "- DISCOVER-BOUNDARY-C1 boundary tables, Wilson intervals, narrow-window usage, failure taxonomy, separate complete-decision and backward-target-exactness budget curves, and the 175/225-CU weak-tier execution record",
              'SI wording')

          header = """<!-- MANUSCRIPT SKELETON v6 - 2026-09-17. AGENT ENDPOINT-DEFINITION CLOSURE.\nSupersedes v5 for Agent Results §3.7, Discussion §4.6, Methods item 13 and the corresponding SI priority wording.\nNo run, trace, scorer or scored value changed. The frozen primary endpoint is winner + decision pair + reachability;\nthe backward parity multiplier is retained as a separate quantitative secondary endpoint. The 75-CU decision-recovery\nthreshold and 225-CU canonical-target threshold are therefore reported separately. -->\n\n"""
          v6 = header + m
          Path('docs/MANUSCRIPT_SKELETON_v6_2026-09-17.md').write_text(v6, encoding='utf-8')
          Path('docs/MANUSCRIPT_SKELETON.md').write_text(v6, encoding='utf-8')

          # Agent Harness.
          p = Path('docs/AGENT_HARNESS.md')
          a = p.read_text(encoding='utf-8')
          a = replace_once(a,
              """Winner-only accuracy is not sufficient evidence. The scorer also checks whether the agent correctly resolves:\n\n- the ranking inversion;\n- the economic winner;\n- the decision pair;\n- the break-even target;\n- scaling-manifold reachability;\n- decision completeness;\n- budget efficiency.""",
              """Winner-only accuracy is not sufficient evidence. The frozen primary endpoint is explicitly decision-level:\n\n`full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct`\n\nThese three scored components are the economic winner, the decision pair and the reachability verdict. The workflow normally reaches the verdict through `BACKWARD` followed by `TEST_REACHABILITY`, but exact numerical recovery of the backward parity multiplier is not a conjunct in `full_decision_correct`. Break-even/parity accuracy is retained as a separate quantitative secondary endpoint (`break_even_estimate`, `break_even_rel_error`). The scorer additionally records ranking inversion, decision regret and budget-efficiency diagnostics.""",
              'harness endpoint')
          a = replace_once(a,
              """A complete decision requires the full chain:\n\n```text\neconomic winner\n -> decision pair\n -> backward target\n -> reachability verdict\n```\n\nThe pooled trend in complete decision recovery across model tiers is strong (Cochran-Armitage Z = **6.95**). The strong tier completes the full chain at every tested budget. Weak tiers often recover the winner but fail later at pair formation, BACKWARD execution or reachability formulation.""",
              """The frozen primary complete-decision endpoint has three scored components:\n\n```text\neconomic winner\n -> decision pair\n -> reachability verdict\n```\n\nThe executed scientific workflow can still contain the four-stage path `winner -> pair -> BACKWARD target -> reachability`, because `BACKWARD` supplies evidence for the final classification. Numerical accuracy of that target is reported separately and does not change `full_decision_correct`.\n\nThe pooled trend in complete decision recovery across model tiers is strong (Cochran-Armitage Z = **6.95**). The strong tier satisfies the primary complete-decision endpoint at every tested budget. Weak tiers often recover the winner but fail later at pair formation, BACKWARD execution or reachability formulation.""",
              'harness cross-model definition')
          anchor = "## Pre-registered E versus fixed-VOI D: negative result"
          if a.count(anchor) != 1:
              raise SystemExit('harness insertion anchor mismatch')
          section = """## C1 separates decision recovery from quantitative-target recovery\n\nDISCOVER-BOUNDARY-C1 resolves two different compute thresholds in the strong tier. The primary complete-decision endpoint is **20/20 at 75 CU** (median ledger-true decision-stable spend **52 CU**) and falls to **13/20 at 50 CU**, making 75 CU the lowest tested stable complete-decision budget. The canonical Ru→Fe backward parity multiplier, **201.223443×**, is a stricter quantitative endpoint: under the frozen first-record convention it is recovered in **9/20** runs at 75 CU, **9/20** at 100 CU, **11/20** at 125 CU, **11/20** at 150 CU, **15/20** at 175 CU and **20/20** at 225 CU. Thus **225 CU is the lowest tested budget with 20/20 canonical-target recovery**.\n\nThis separation is intentional rather than contradictory. A run can reach the correct winner, pair and reachability classification before its numerical parity multiplier converges to the canonical value. The V1 result already shows the same distinction: the strong tier has **35/35** complete decisions but **34/35** exact break-even recovery.\n\n"""
          a = a.replace(anchor, section + anchor, 1)
          p.write_text(a, encoding='utf-8')

          # Results at a glance.
          p = Path('docs/RESULTS_AT_A_GLANCE.md')
          r = p.read_text(encoding='utf-8')
          r = replace_once(r,
              "The complete decision requires the full chain: economic winner -> decision pair -> backward target -> reachability verdict. The pooled tier trend in P(full) is strong (Cochran-Armitage Z = **6.95**).",
              "The frozen primary endpoint is `full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct`: economic winner, decision pair and reachability verdict. The workflow uses `BACKWARD` to support the reachability classification, but numerical recovery of the backward parity multiplier is a separate quantitative secondary endpoint. The pooled tier trend in P(full) is strong (Cochran-Armitage Z = **6.95**).",
              'results endpoint')
          r = replace_once(r,
              "At 175 CU, narrow-window construction is used in **20/20 strong**, **4/20 mini**, and **0/20 nano** runs. At 225 CU, strong E reaches full decision at a median of approximately **218 CU** versus **206 CU** for D.",
              "The primary decision endpoint and the quantitative backward target converge at different budgets. Strong E reaches **20/20 complete decisions at 75 CU**, with median ledger-true decision-stable spend **52 CU**, while canonical **201.223443×** backward-target recovery is only **9/20** there and reaches **20/20 at 225 CU**. Thus **75 CU is the lowest tested stable complete-decision budget**, whereas **225 CU is the lowest tested budget with 20/20 canonical backward-target recovery**.\n\nUnder the canonical narrow-window rule — a window strictly smaller than the 14,136-state domain and actually used by a later scoped action — allocation at 175 CU occurs in **20/20 strong**, **0/20 mini**, and **0/20 nano** runs. At 225 CU, strong E reaches full decision at a median of approximately **218 CU** versus **206 CU** for D.",
              'results thresholds')
          p.write_text(r, encoding='utf-8')

          # README public summary.
          p = Path('README.md')
          rd = p.read_text(encoding='utf-8')
          rd = replace_once(rd,
              "The positive result is that full decision-chain execution is strongly model-capability dependent. The stronger pre-registered hypothesis — adaptive policy E consistently outperforms fixed-VOI policy D — was **not supported across tiers**.",
              "The frozen primary complete-decision endpoint is the conjunction of the correct economic winner, decision pair and reachability verdict; numerical accuracy of the backward parity multiplier is reported separately. The positive result is that decision-aware workflow execution is strongly model-capability dependent. The stronger pre-registered hypothesis — adaptive policy E consistently outperforms fixed-VOI policy D — was **not supported across tiers**.",
              'README endpoint')
          rd = replace_once(rd,
              """At 175 CU, narrow-window construction occurs in **20/20 strong**, **4/20 mini** and **0/20 nano** runs. At 225 CU the strong policy reaches full decision at a median of approximately **218 CU**, later than D at **206 CU**.\n\nPhase B completed **80/80 formal runs**, with **0 smoke**, **0 infrastructure retry**, **0 driver exception**, and frozen hashes **15/15 PASS** before and after. The executed two-budget/no-smoke design was a cost-motivated reduction made before the first Phase B API call and is recorded transparently in addendum A2.""",
              """Under the canonical narrow-window rule, allocation at 175 CU occurs in **20/20 strong**, **0/20 mini** and **0/20 nano** runs. The primary decision endpoint and quantitative target separate: strong E reaches **20/20 complete decisions at 75 CU**, whereas the canonical **201.223443×** backward target reaches **20/20 at 225 CU**. At 225 CU the strong policy reaches full decision at a median of approximately **218 CU**, later than D at **206 CU**.\n\nThe weak-tier transfer arm was evaluated at the two discriminative cells, **175 and 225 CU**, which straddle the fixed-policy threshold: **80/80 formal runs**, **0 smoke**, **0 infrastructure retry**, **0 driver exception**, and frozen hashes **15/15 PASS** before and after.""",
              'README C1')
          p.write_text(rd, encoding='utf-8')

          # Permanent CI validator (no auto-editing).
          ci = r"""name: Agent endpoint consistency

on:
  push:
    branches: [main]
    paths:
      - 'docs/MANUSCRIPT_SKELETON.md'
      - 'docs/MANUSCRIPT_SKELETON_v6_2026-09-17.md'
      - 'docs/AGENT_HARNESS.md'
      - 'docs/RESULTS_AT_A_GLANCE.md'
      - 'README.md'
      - '.github/workflows/agent-endpoint-consistency.yml'
  pull_request:
    paths:
      - 'docs/MANUSCRIPT_SKELETON.md'
      - 'docs/MANUSCRIPT_SKELETON_v6_2026-09-17.md'
      - 'docs/AGENT_HARNESS.md'
      - 'docs/RESULTS_AT_A_GLANCE.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check endpoint definitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
              'manuscript': Path('docs/MANUSCRIPT_SKELETON.md'),
              'v6': Path('docs/MANUSCRIPT_SKELETON_v6_2026-09-17.md'),
              'harness': Path('docs/AGENT_HARNESS.md'),
              'results': Path('docs/RESULTS_AT_A_GLANCE.md'),
              'readme': Path('README.md'),
          }
          text = {k: p.read_text(encoding='utf-8') for k, p in files.items()}
          forbidden = [
              'A complete decision requires the economic winner, the decision pair, the backward target and the reachability verdict',
              'The complete decision requires the full chain: economic winner -> decision pair -> backward target -> reachability verdict',
              'A complete decision requires the full chain:',
          ]
          for name, body in text.items():
              for phrase in forbidden:
                  if phrase in body:
                      raise SystemExit(f'{name}: stale four-component primary-endpoint wording: {phrase}')
          formula = 'full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct'
          for name in ('manuscript', 'v6', 'harness', 'results'):
              if formula not in text[name]:
                  raise SystemExit(f'{name}: frozen primary-endpoint formula missing')
          for name in files:
              if '75 CU' not in text[name] or '225 CU' not in text[name]:
                  raise SystemExit(f'{name}: 75/225-CU threshold separation missing')
          if '**4/20 mini**' in text['readme'] or '**4/20 mini**' in text['results']:
              raise SystemExit('legacy bounds-only mini narrow-window count reintroduced')
          if '**0/20 mini**' not in text['readme'] or '**0/20 mini**' not in text['results']:
              raise SystemExit('canonical mini narrow-window count missing')
          print('PASS: endpoint definition, dual thresholds and narrow-window counts are consistent.')
          PY
"""
          Path('.github/workflows/agent-endpoint-consistency.yml').write_text(ci, encoding='utf-8')

          # Remove both one-shot workflows from final tree.
          for q in [Path('.github/workflows/apply-agent-endpoint-closure.yml'), Path('.github/workflows/apply-agent-endpoint-closure-v2.yml')]:
              if q.exists():
                  q.unlink()
          PY

      - name: Validate normalized working tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
              'manuscript': Path('docs/MANUSCRIPT_SKELETON.md'),
              'v6': Path('docs/MANUSCRIPT_SKELETON_v6_2026-09-17.md'),
              'harness': Path('docs/AGENT_HARNESS.md'),
              'results': Path('docs/RESULTS_AT_A_GLANCE.md'),
              'readme': Path('README.md'),
          }
          text = {k: p.read_text(encoding='utf-8') for k, p in files.items()}
          formula = 'full_decision_correct = winner_correct ∧ pair_decision_correct ∧ reachability_correct'
          for name in ('manuscript','v6','harness','results'):
              assert formula in text[name], name
          for name in files:
              assert '75 CU' in text[name] and '225 CU' in text[name], name
          assert '**4/20 mini**' not in text['readme']
          assert '**4/20 mini**' not in text['results']
          assert '**0/20 mini**' in text['readme']
          assert '**0/20 mini**' in text['results']
          print('PASS')
          PY

      - name: Commit closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Agent decision endpoint and quantitative target thresholds"
          git push
