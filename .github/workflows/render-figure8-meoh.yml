name: Render Figure 8 MeOH

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figures/meoh/render_F08_selectivity_recycle.R'
      - 'data/meoh/meoh_candidate_ranking_D01v3.csv'
      - 'data/meoh/meoh_purge_robustness_D01v3.csv'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core
          Rscript --version

      - name: Render frozen Figure 8
        run: Rscript figures/meoh/render_F08_selectivity_recycle.R .

      - name: Verify outputs
        run: |
          test -s figures/meoh/F08_MeOH_selectivity_recycle_D01v3.svg
          test -s figures/meoh/F08_MeOH_selectivity_recycle_D01v3.pdf
          test -s figures/meoh/F08_MeOH_selectivity_recycle_D01v3.png
          sha256sum \
            data/meoh/meoh_candidate_ranking_D01v3.csv \
            data/meoh/meoh_purge_robustness_D01v3.csv \
            figures/meoh/render_F08_selectivity_recycle.R \
            figures/meoh/F08_MeOH_selectivity_recycle_D01v3.svg \
            figures/meoh/F08_MeOH_selectivity_recycle_D01v3.pdf \
            figures/meoh/F08_MeOH_selectivity_recycle_D01v3.png \
            > figures/meoh/F08_RENDER_SHA256.txt

      - name: Commit deterministic render
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/meoh/F08_MeOH_selectivity_recycle_D01v3.svg \
                  figures/meoh/F08_MeOH_selectivity_recycle_D01v3.pdf \
                  figures/meoh/F08_MeOH_selectivity_recycle_D01v3.png \
                  figures/meoh/F08_RENDER_SHA256.txt
          if git diff --cached --quiet; then
            echo "No render changes to commit"
          else
            git commit -m "Render frozen Figure 8 assets"
            # Several jobs can be in flight at once; a bare push loses the race
            # and throws away a run whose checks already passed.
            target="$(git rev-parse --abbrev-ref HEAD)"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "$target" && git push origin HEAD:"$target"; then
                pushed=1; break
              fi
              echo "push attempt $attempt lost a race with another job; retrying"
              sleep $(( (RANDOM % 5) + 2 ))
            done
            [ "$pushed" = 1 ] || { echo "could not push after 5 attempts"; exit 1; }
          fi
