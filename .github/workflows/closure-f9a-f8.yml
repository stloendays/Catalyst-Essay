name: F9A revalidation and Figure 8 closure

# Retriggered 2026-09-10 after GitHub Actions runner access was restored.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/f9a_ci_revalidation_probe.py'

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deterministic F9A provenance and metric-equivalence probe
        run: |
          python3 ci/f9a_ci_revalidation_probe.py
          cat artifacts/f9a_ci/classification.txt
          cat artifacts/f9a_ci/CROSS_REACTION_FINAL1_1_CI_ATTEMPT.md

      # The Figure 8 half of this closure rendered F8 in R and committed the result
      # over the canonical assets. F8 is now the Origin build promoted on
      # 2026-09-23 (figures/meoh/F08_RENDER_SHA256.txt), so re-running that half
      # would silently replace the locked figure. It was removed; the R reference
      # renderer still runs, without writing, in f8-render-repro.yml.

      - name: Commit deterministic closure outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/f9a_ci
          if git diff --cached --quiet; then
            echo 'No closure outputs changed.'
          else
            git commit -m 'Record F9A CI revalidation attempt'
            # Several jobs can be in flight at once; a bare push loses the race
            # and throws away a run whose checks already passed.
            target="main"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "$target" && git push origin HEAD:"$target"; then
                pushed=1; break
              fi
              echo "push attempt $attempt lost a race with another job; retrying"
              sleep $(( (RANDOM % 5) + 2 ))
            done
            [ "$pushed" = 1 ] || { echo "could not push after 5 attempts"; exit 1; }
          fi

      - name: Final infrastructure status
        if: always()
        run: |
          echo 'F9A classification:'
          cat artifacts/f9a_ci/classification.txt
