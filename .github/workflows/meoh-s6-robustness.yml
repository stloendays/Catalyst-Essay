name: MeOH S6 robustness checks (S5 frozen vs S6)

# Reruns analysis/meoh_s6_robustness_2026_10_13: every robustness check of the methanol field result under the frozen
# loop (S5, reproduced) and the inlet-limited loop (S6, primary since 2026-10-13), then checks the S5 frozen anchors
# (15/40, 304/1,997, 31/40, 12/40, 11 of 15 noise-robust, 16/40 catalyst-priced, split 14-18/40, closure 11/28) and
# the S6 anchors (28/40, 22 > 5 %).
#
# By default the measurement-noise part (item 1C) runs from the committed exact-run cache (stats_s6/exact_cache.csv.gz)
# and a random sample of 300 cached runs is recomputed. workflow_dispatch with fresh=true discards the S6 cache, grid
# and scenario files and recomputes every exact run (about 4e4 plant-model sweeps; 2-3 h on 4 cores).

on:
  pull_request:
    paths:
      - "analysis/meoh_s6_robustness_2026_10_13/**"
      - ".github/workflows/meoh-s6-robustness.yml"
  push:
    branches: ["analysis/meoh-s6-robustness-2026-10-13"]
  workflow_dispatch:
    inputs:
      fresh:
        description: "Recompute every S6 exact plant-model run (ignore the committed cache)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meoh-s6-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s6-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONIOENCODING: utf-8
      STATS_WORKERS: "4"
      INV_WORKERS: "4"
      CATCOST_WORKERS: "4"
      D: analysis/meoh_s6_robustness_2026_10_13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml
      - name: Keep a copy of the committed outputs
        run: |
          mkdir -p /tmp/committed
          cp $D/results.json $D/frozen_columns.json $D/selectivity_split.json $D/catalyst_cost.json /tmp/committed/
          cp $D/stats_s6/summary.json /tmp/committed/stats_s6_summary.json
      - name: Rerun the statistics from the exact-run caches (drop the finished scenario and grid files)
        run: rm -f $D/stats_s5/* $D/stats_s6/scenario_*.json $D/stats_s6/grid_costs.csv
      - name: Fresh S6 exact runs (dispatch input)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh }}
        run: rm -f $D/stats_s6/*
      - name: Items 2, 3, 5, 7, 8, 9 from the frozen columns (asserts S5 and S6 anchors)
        run: python $D/run_frozen_columns.py
      - name: Item 1, S5 (frozen code and frozen exact cache)
        run: python $D/run_stats_wrapper.py s5
      - name: Item 1, S6 (constrained purge for every perturbed entry)
        run: python $D/run_stats_wrapper.py s6
      - name: Recompute a sample of the S6 exact cache; S5 values against the frozen cache
        run: cd $D && python verify_cache_sample.py 300
      - name: Item 4, unreported CO/CH4 split
        run: python $D/run_selectivity_split_wrapper.py
      - name: Item 6, catalyst priced from composition
        run: python $D/run_catalyst_cost_wrapper.py
      - name: Collect, check every anchor
        run: python $D/build_report.py
      - name: Regenerated outputs equal the committed ones (counts exact, costs 1e-6)
        run: |
          for f in results.json frozen_columns.json selectivity_split.json catalyst_cost.json; do
            python tools/compare_json_numbers.py /tmp/committed/$f $D/$f --rtol 1e-6
          done
          python tools/compare_json_numbers.py /tmp/committed/stats_s6_summary.json $D/stats_s6/summary.json --rtol 1e-6
      - name: Frozen inputs unchanged
        run: git diff --exit-code -- analysis/meoh_literature_inversion_2026_10_05/ analysis/meoh_main_result_stats_2026_10_06/ analysis/meoh_catalyst_cost_2026_10_06/ analysis/meoh_constraint_boundary_2026_10_12/ analysis/meoh_inlet_definition_2026_10_12/ data/meoh/ docs/ figures/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meoh-s6-robustness
          path: |
            analysis/meoh_s6_robustness_2026_10_13/*.json
            analysis/meoh_s6_robustness_2026_10_13/*.csv
            analysis/meoh_s6_robustness_2026_10_13/*.md
            analysis/meoh_s6_robustness_2026_10_13/stats_s5/*.json
            analysis/meoh_s6_robustness_2026_10_13/stats_s6/*.json
            analysis/meoh_s6_robustness_2026_10_13/stats_s6/*.csv
          retention-days: 90
